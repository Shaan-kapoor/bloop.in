<script>
'use strict';
// ══════════════════════════ screen ══════════════════════════
// Portrait-first. The game is drawn 180 logical pixels wide and as tall as
// the phone allows; all DOM UI is sized in the same logical unit (--u).
const $ = id => document.getElementById(id);
const GW = 180, W4 = GW * 4, T = 128, TAU = Math.PI * 2;
let GH = 340;
const cv = $('c'), ctx = cv.getContext('2d');
const fc = document.createElement('canvas'), f = fc.getContext('2d', { willReadFrequently: true });
let out, o32, bgBuf, bgSh, surfArr = new Float32Array(GW);

function fit() {
  const vw = innerWidth, vh = innerHeight, ratio = Math.max(1.6, Math.min(2.2, vh / vw));
  const w = Math.min(vw, vh / ratio), h = w * ratio, st = $('stage');
  st.style.width = w + 'px'; st.style.height = h + 'px';
  document.documentElement.style.setProperty('--u', w / GW + 'px');
  const gh = +new URLSearchParams(location.search).get('gh') || Math.round(GW * ratio);
  if (gh !== GH || !out) { GH = gh; cv.width = fc.width = GW; cv.height = fc.height = GH; out = ctx.createImageData(GW, GH); o32 = new Uint32Array(out.data.buffer); buildBg(); return true; }
}

// ══════════════════════════ goo renderer ══════════════════════════
// Goo is splatted additively into an offscreen field (one colour channel per
// goo type), then every pixel is shaded from the field's value and slope:
// outline, rim light, shade, deep core, glint, with ordered dither.
function sprite(rgb) {
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  for (let i = 0; i <= 12; i++) { const t = i / 12; gr.addColorStop(t, `rgba(${rgb},${(1 - t * t) ** 2})`); }
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
}
const SPR = [sprite('255,0,0'), sprite('0,255,0'), sprite('0,0,255')], SOLID = ['#f00', '#0f0', '#00f'];
// ch: 0 blue (you, droplets, pool) · 1 violet (pods) · 2 gold
function ball(x, y, r, ch = 0) { if (r <= 0) return; const R = r * 1.85; f.drawImage(SPR[ch], x - R, y - R, R * 2, R * 2); }
function slab(x, y, w, h, ch = 0) { f.fillStyle = SOLID[ch]; f.fillRect(x, y, w, h); }
const abgr = h => { const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; };
// tones: 0 outline, 1 shade, 2 core, 3 body, 4 light, 5 rim, 6 glint
const PAL = [
  ['#0a1a52', '#1f47c9', '#2f6cf0', '#3f8cff', '#74bcff', '#b8e6ff', '#ffffff'],
  ['#1c1147', '#4a35b0', '#5d49cf', '#7a66ea', '#a595ff', '#d6ceff', '#ffffff'],
  ['#4f2f0c', '#d98a1c', '#f2b02c', '#ffc944', '#ffe07a', '#fff3bf', '#ffffff'],
].map(p => p.map(abgr));
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const THEMES = [   // 7 backdrop tones, dark to light, then the colour of drifting specks and bubbles
  ['#07081a', '#0a0b22', '#0d0e2b', '#111235', '#15153f', '#1a1949', '#201e55', '#3a3990'],   // indigo
  ['#04101a', '#061723', '#081f2d', '#0b2838', '#0e3243', '#123d4f', '#17495c', '#2f7f93'],   // teal
  ['#12061a', '#190a24', '#200e2e', '#291339', '#321844', '#3c1e50', '#47255d', '#7d4aa0'],   // plum
  ['#040a1f', '#06102b', '#081637', '#0b1d44', '#0f2552', '#132e60', '#18386f', '#3766b0'],   // navy
  ['#1a0611', '#240a18', '#2e0e20', '#391329', '#441833', '#501e3d', '#5d2548', '#a04a78'],   // wine
].map(t => t.map(abgr));
let RAMP = THEMES[0], SPECK = THEMES[0][7];
function setTheme(i) { RAMP = THEMES[i]; SPECK = RAMP[7]; if (out) buildBg(); }
function buildBg() {
  bgBuf = new Uint32Array(GW * GH); bgSh = new Uint32Array(GW * GH);
  const bokeh = [[30, GH * .2, 40], [150, GH * .32, 46], [90, GH * .6, 60], [165, GH * .82, 36], [20, GH * .78, 40]];
  for (let y = 0, i = 0; y < GH; y++) for (let x = 0; x < GW; x++, i++) {
    let s = 1.5 + 2.6 * y / GH;
    for (const [bx, by, br] of bokeh) { const d = Math.hypot(x - bx, y - by); if (d < br) s += 1.2 * (1 - d / br); }
    const dx = (x - GW / 2) / (GW / 2), dy = (y - GH / 2) / (GH / 2);
    s -= 1.5 * Math.max(0, dx * dx * .7 + dy * dy - .62);
    s += 1.1 * Math.max(0, Math.sin((x + y * .5) * .05 + 1.2)) ** 3 * Math.max(0, 1 - y / (GH * .7));   // slanted shafts of light from above
    const k = Math.max(0, Math.min(6, Math.floor(s + BAY[(y & 3) << 2 | (x & 3)] / 16)));
    bgBuf[i] = RAMP[k]; bgSh[i] = RAMP[Math.max(0, k - 2)];
  }
}
const specks = [...Array(26)].map(() => ({ x: Math.random() * GW, y: Math.random() * 400, s: 2 + Math.random() * 5 }));
const bubbles = [...Array(6)].map(() => ({ x: Math.random() * GW, y: Math.random() * 400, r: 2 + Math.random() * 4, s: 5 + Math.random() * 8, ph: Math.random() * 6 }));
let surf = false; const orbs = [];
const orb = (x, y, R) => orbs.push({ x, y, R, R2: R * R });

function render(dt) {
  const d = f.getImageData(0, 0, GW, GH).data, W = GW, H = GH;
  o32.set(bgBuf);
  for (const s of specks) { s.y -= s.s * dt; if (s.y < 0) { s.y = H - 1; s.x = Math.random() * W; } if (s.y < H) o32[(s.y | 0) * W + (s.x | 0)] = SPECK; }
  for (const b of bubbles) {   // slow bubbles drifting up behind everything
    b.y -= b.s * dt; if (b.y < -8) { b.y = H + 8; b.x = Math.random() * W; }
    const bx = b.x + Math.sin(now * .8 + b.ph) * 3, n = 8 + (b.r * 2 | 0);
    for (let k = 0; k < n; k++) { const a = k / n * TAU, px = bx + Math.cos(a) * b.r | 0, py = b.y + Math.sin(a) * b.r | 0; if (px >= 0 && px < W && py >= 0 && py < H) o32[py * W + px] = SPECK; }
  }
  const sh = (3 * W + 2) * 4;
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    const p = i << 2; let c = -1, m = T - 1;
    if (d[p] > m) { c = 0; m = d[p]; }
    if (d[p + 1] > m) { c = 1; m = d[p + 1]; }
    if (d[p + 2] > m) { c = 2; }
    if (c < 0) {
      let o = -1, q;
      if (x > 0) { q = p - 4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && x < W - 1) { q = p + 4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && y > 0) { q = p - W4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && y < H - 1) { q = p + W4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o >= 0) o32[i] = PAL[o][0];
      else if (x >= 2 && y >= 3) { q = p - sh; if (d[q] >= T || d[q + 1] >= T || d[q + 2] >= T) o32[i] = bgSh[i]; }
      continue;
    }
    const pc = p + c, v = d[pc], P = PAL[c], dz = BAY[(y & 3) << 2 | (x & 3)] / 16 - .5;
    const gx = (x < W - 2 ? d[pc + 8] : v) - (x > 1 ? d[pc - 8] : v);

  R.state = 'play'; R.cool = .3; R.left = maxDrops(); R.value = fieldValue(); save(); ui.round();
}

function addBall(x, y, vx, vy, o = {}) {
  const mini = !!o.mini, r = mini ? 2.6 : 4 + lv('fat') * .7;
  R.balls.push({ x, y, vx, vy, r, dmg: dmgNow() * (mini ? .5 : 1), mini, plough: mini ? 0 : lv('heavy') * 2, lastP: null, leak: !!o.leak, wear: o.wear || (mini ? 3 : wearMax()), split: mini || !!o.split, skips: mini ? 0 : lv('skip'), hits: 0, age: 0, slowT: 0, sq: 0, trail: 0 });
}
function fire(a) {
  if (R.state !== 'play' || R.left <= 0 || R.cool > 0) return false;
  R.left--; R.shots++; R.cool = .22; R.sinceShot = 0;
  addBall(LX + Math.cos(a) * 8, LY + Math.sin(a) * 8, Math.cos(a) * SPEED, Math.sin(a) * SPEED);
  sfx.fire(); buzz(8); ui.pips(); $('hint').classList.remove('on');
  return true;
}

function bitsBurst(x, y, n, speed, ch, up) {
  if (R.bits.length > 170) return;
  for (let i = 0; i < n; i++) {
    const a = up ? rnd(-Math.PI * .85, -Math.PI * .15) : rnd(0, TAU), v = rnd(.4, 1) * speed;
    R.bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(1.4, 2.6), ch, g: 300, shrink: 4.5 });
  }
}
function damage(p, dmg, nx = 0, ny = 0) {
  if (p.dead) return;
  p.hp -= dmg; p.sv += 9; p.vx += nx * 60; p.vy += ny * 60;
  if (p.hp <= 0) popPod(p); else bitsBurst(p.x, p.y, 2, 50, p.type === 'gold' ? 2 : 1);
}
function popPod(p) {
  p.dead = true; R.popped++; R.combo++; R.comboT = 1.4; R.best = Math.max(R.best, R.combo);
  const gold = p.type === 'gold', n = clamp(Math.round(p.rel * 2.4), 1, 4);
  const mul = 1 + Math.min(R.combo, 40) * .02 * lv('combo'), tier = Math.floor((mul - 1) / .5);
  if (tier > R.mulTier) { R.mulTier = tier; popup(GW / 2, GH * .22, 'goo ×' + (1 + tier * .5).toFixed(1), 'gold'); }
  const each = Math.max(1, Math.round(layerVal(S.layer) * richMul() * p.rel * (gold ? 16 : 1) / n * mul * 1.6));
  for (let i = 0; i < n; i++) R.drops.push({ x: p.x + rnd(-2, 2), y: p.y + rnd(-2, 2), vx: rnd(-55, 55), vy: rnd(-120, -30), val: each, big: gold, ch: gold || tier > 0 ? 2 : 0, r: gold ? 2.8 : 1.9 + Math.min(1.1, lv('rich') * .07) });
  bitsBurst(p.x, p.y, 5, 80, gold ? 2 : 1);
  for (let i = 0; i < 4; i++) { const a = rnd(0, TAU), v = rnd(40, 110); R.sparks.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: rnd(.25, .5) }); }
  R.rings.push({ x: p.x, y: p.y, r: p.r, life: .32, c: gold ? '#ffe07a' : '#d6ceff' });
  sfx.pop(R.combo, p.x, gold); buzz(5); ui.combo();
  if (R.combo > 5) shake(Math.min(2.5, R.combo * .05));   // chains rumble harder the longer they run
  if (gold) popup(p.x, p.y - 8, 'gold!', 'gold');
  if (lv('splash')) R.queue.push({ t: .075, x: p.x, y: p.y, rad: 13 + lv('splash') * 4.5, dmg: dmgNow() * .6, pm: .02 * lv('splash') });
  if (p.type === 'bomb') { R.queue.push({ t: .05, x: p.x, y: p.y, rad: 40, dmg: dmgNow() * 5, pm: .5, boom: true }); R.freeze = .06; }
  if (lv('tad') && !(R.src && R.src.mini) && (S.sure.tad || Math.random() < .06 * lv('tad'))) { delete S.sure.tad; addBall(p.x, p.y, rnd(-70, 70), -rnd(90, 150), { mini: true }); }
  const rem = R.total - R.popped;
  if (rem > 0 && rem <= 2 && R.total > 6 && R.balls.length) { popup(GW / 2, GH * .3, rem + ' LEFT!', 'big'); R.slow = Math.max(R.slow, .4); }
  if (rem === 0 && !R.cleared) {   // every pod gone in one round: go deeper
    R.cleared = true; R.slow = 1.2;
    const bonus = Math.round(R.value * (.5 + .15 * R.left)); R.left = 0;
    for (let i = 0; i < 14; i++) R.drops.push({ x: rnd(10, GW - 10), y: rnd(60, GH * .5), vx: rnd(-40, 40), vy: rnd(-90, 0), val: Math.ceil(bonus / 14), ch: 2, r: 2.6 });
    toast(`DEPTH ${S.layer}\nCLEARED`); sfx.clear(); shake(5); buzz([20, 40, 20, 40, 60]); ui.pips();
  }
  ui.bar();
}

// One fixed physics step. The aim preview runs the very same code, so the dots tell the truth.
function stepBall(b, dt, live) {
  b.vy += GRAV * dt; b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * .8; } else if (b.x > GW - b.r) { b.x = GW - b.r; b.vx = -Math.abs(b.vx) * .8; }
  if (b.y < b.r + 22) { b.y = b.r + 22; b.vy = Math.abs(b.vy) * .6; }
  const e = .6 + .07 * lv('bounce');
  for (const p of R.pods) {
    if (p.dead || p.born < .1) continue;
    const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + p.r; if (dx * dx + dy * dy >= rr * rr) continue;
    const d = Math.hypot(dx, dy) || .01, nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
    if (live && (b.plough > 0 || b.lastP === p) && p.type !== 'bomb') {   // heavy: straight through, hurting as it goes
      if (b.lastP !== p) { b.lastP = p; b.plough--; hitPod(b, p, nx, ny); b.vx *= .92; b.vy *= .92; }
      continue;
    }
    b.x = p.x + nx * rr; b.y = p.y + ny * rr;
    if (vn < 0) {
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      const o = b.vx * nx + b.vy * ny; if (o < 22) { b.vx += nx * (22 - o); b.vy += ny * (22 - o); }
      if (vn > -30) continue;   // a soft touch just slides off; only a real knock counts
      if (live) hitPod(b, p, nx, ny); else return true;
    }
  }
  const sp = Math.hypot(b.vx, b.vy); if (sp > 430) { b.vx *= 430 / sp; b.vy *= 430 / sp; }
}
function hitPod(b, p, nx, ny) {
  b.hits++; b.sq = 1; b.wear--;
  if (p.hp > b.dmg) { R.combo++; R.comboT = 1.4; R.best = Math.max(R.best, R.combo); sfx.hit(R.combo, p.x); ui.combo(); }
  R.src = b; damage(p, b.dmg, -nx, -ny); R.src = null;
  if (!b.split && lv('twin')) {
    b.split = true; const sp = Math.hypot(b.vx, b.vy), a0 = Math.atan2(b.vy, b.vx);
    for (let k = 1; k <= lv('twin'); k++) { const a = a0 + (k % 2 ? 1 : -1) * .5 * Math.ceil(k / 2); addBall(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, { split: true, wear: Math.max(2, Math.ceil(b.wear / 2)) }); }
    R.rings.push({ x: b.x, y: b.y, r: 4, life: .3, c: '#b8e6ff' }); sfx.split();
  }
}

function update(rdt) {
  now += rdt;
  if (!R) return;
  if (R.freeze > 0) { R.freeze -= rdt; return; }
  let dt = rdt; if (R.slow > 0) { R.slow -= rdt; dt *= .3; }
  R.t += dt; R.cool -= dt; R.sinceShot += dt;
  if ((R.comboT -= dt) <= 0 && R.combo) { R.combo = 0; ui.combo(); }
  if (R.pending != null && R.cool <= 0) { fire(R.pending); R.pending = null; }

  for (const p of R.pods) {
    p.born += dt; p.sv += (-260 * p.s - 9 * p.sv) * dt; p.s += p.sv * dt * .1;
    p.vx += (-300 * p.ox - 10 * p.vx) * dt; p.vy += (-300 * p.oy - 10 * p.vy) * dt; p.ox += p.vx * dt; p.oy += p.vy * dt;
    p.r += (podR(hits(p)) + (p.type === 'bomb' ? 1 : 0) - p.r) * Math.min(1, dt * 12);
  }
  for (const q of R.queue) if ((q.t -= dt) <= 0) {
    q.done = true; R.rings.push({ x: q.x, y: q.y, r: q.rad * .5, life: .25, c: q.boom ? '#fff3bf' : '#74bcff', grow: q.rad * 2.4 });
    if (q.boom) { shake(6); sfx.boom(); buzz(30); bitsBurst(q.x, q.y, 12, 150, 2); }
    for (const p of R.pods) if (!p.dead) { const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy); if (d < q.rad + p.r * .5) damage(p, q.dmg + p.max * q.pm, dx / (d || 1), dy / (d || 1)); }
  }
  R.queue = R.queue.filter(q => !q.done);

  // leaky tap: a few free mini drops dribble out of the tap once the round is under way
  if (R.state === 'play' && lv('leak') && R.shots > 0 && R.popped < R.total && R.leaks < lv('leak') * 3 && (R.leakT -= dt) <= 0) {
    R.leaks++; R.leakT = .9; addBall(LX, LY + 6, rnd(-80, 80), 30, { mini: true, leak: true }); sfx.plop(R.leaks, LX);
  }

  for (const b of R.balls) {
    b.age += dt; b.sq = Math.max(0, b.sq - dt * 6);
    for (let k = Math.max(1, Math.round(dt / STEP)); k > 0; k--) stepBall(b, STEP, true);
    if ((b.trail -= dt) <= 0 && R.bits.length < 170) { b.trail = .03; R.bits.push({ x: b.x, y: b.y, vx: 0, vy: 0, r: b.r * .6, ch: 0, shrink: 9 }); }
    b.slowT = Math.hypot(b.vx, b.vy) < 45 ? b.slowT + dt : 0;
    if (b.slowT > 1.1 || b.age > 14 || b.wear <= 0) { b.dead = true; bitsBurst(b.x, b.y, 5, 70, 0); sfx.fizz(); continue; }   // a drop that settles melts away
    if (b.y > pool.top(b.x) - b.r * .3 && b.vy > 0) {
      if (b.skips > 0) {
        b.skips--; b.wear = Math.max(b.wear, Math.ceil(wearMax() / 2)); b.vy = -Math.max(200, b.vy * .9); pool.splash(b.x, 120); bitsBurst(b.x, pool.top(b.x), 6, 110, 0, true);
        R.rings.push({ x: b.x, y: pool.top(b.x), r: 5, life: .3, c: '#b8e6ff' }); sfx.skip(); buzz(10);
      } else { b.dead = true; pool.splash(b.x, 90); bitsBurst(b.x, pool.top(b.x), b.mini ? 2 : 5, 90, 0, true); sfx.sink(b.x, !b.mini); }
    }
  }
  R.balls = R.balls.filter(b => !b.dead);

  for (const d of R.drops) {
    d.vy += 300 * dt; d.vx *= 1 - dt; d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.x < 2) { d.x = 2; d.vx = Math.abs(d.vx); } else if (d.x > GW - 2) { d.x = GW - 2; d.vx = -Math.abs(d.vx); }
    if (d.y > pool.top(d.x) && d.vy > 0) {
      d.dead = true; R.haul += d.val; R.got += d.val; pool.splash(d.x, 16);
      sfx.plop(R.plops++, d.x);
      if (d.big) popup(d.x, pool.top(d.x) - 8, '+' + fmt(d.val), 'gold');
    }
  }
  R.drops = R.drops.filter(d => !d.dead);
  for (const b of R.bits) { if (b.g) b.vy += b.g * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r -= dt * b.shrink; if (b.vy > 0 && b.y > pool.top(clamp(b.x, 0, GW - 1)) + 2) b.r = 0; }
  R.bits = R.bits.filter(b => b.r > .4);
  for (const s of R.sparks) { s.life -= dt; s.vy += 160 * dt; s.x += s.vx * dt; s.y += s.vy * dt; }
  R.sparks = R.sparks.filter(s => s.life > 0);
  for (const r of R.rings) { r.life -= dt; r.r += (r.grow || 40) * dt; }
  R.rings = R.rings.filter(r => r.life > 0);
  pool.update(dt, 12 + 54 * (1 - Math.exp(-1.6 * R.haul / Math.max(1, R.value))));

  if (R.state === 'play') {
    const idle = !R.balls.length && !R.drops.length && !R.queue.length;
    if (R.left === 0 && idle && R.pending == null) {
      if ((R.endT += dt) > .4) {
        if (!R.cleared && !R.chance && R.popped / R.total >= .9) {   // so close: one more drop, once
          R.chance = true; R.left = 1; R.cool = .35; R.endT = 0; toast('LAST\nCHANCE'); sfx.near(); buzz([15, 30, 15]); ui.pips();
        } else { R.state = 'tally'; R.rate = Math.max(1, R.haul) / .8; R.tick = 0; }
      }
    } else R.endT = 0;
  } else if (R.state === 'tally') {
    const amt = Math.min(R.haul, R.rate * dt); R.haul -= amt; S.goo += amt;
    if ((R.tick -= dt) <= 0 && amt > 0) { R.tick = .05; sfx.tick(R.plops++); }
    if (R.haul <= .001) {
      S.goo = Math.round(S.goo); S.rounds++;
      const prev = { got: R.got, pct: Math.round(R.popped / R.total * 100), left: R.total - R.popped, cleared: R.cleared, combo: R.best, total: R.total };
      if (R.cleared) { S.layer++; S.best = 0; } else S.best = Math.max(S.best, prev.pct);
      save(); newRound(prev);
    }
  }
}

function draw() {
  surf = true; pool.draw();
  for (const p of R.pods) {
    if (p.dead) continue;
    const k = clamp(p.born / .18, 0, 1), r = p.r * (1 + p.s) * (k < 1 ? k * (1.3 - .3 * k) : 1); if (r <= 0) continue;
    const pulse = p.type === 'bomb' ? Math.sin(now * 7) * .6 : 0;
    ball(p.x + p.ox, p.y + p.oy, r + pulse, p.type === 'gold' ? 2 : 1);
    if (r > 5) orb(p.x + p.ox, p.y + p.oy, r + 1.5);
  }
  for (const d of R.drops) { ball(d.x, d.y, d.r, d.ch); ball(d.x - d.vx * .02, d.y - d.vy * .02, d.r * .6, d.ch); }
  for (const b of R.bits) ball(b.x, b.y, b.r, b.ch);
  for (const b of R.balls) {
    const r = b.r * (b.mini ? 1 : .62 + .38 * Math.min(1, b.wear / wearMax()));   // a drop thins as it spends itself
    ball(b.x, b.y, r + b.sq * .8); ball(b.x - b.vx * .012, b.y - b.vy * .012, r * .75);
    if (r > 3.2) orb(b.x, b.y, r + 1.5);
  }
  // the tap: a gold pipe coming down from the top, with the next drop hanging from it
  slab(LX - 3, 0, 6, LY - 14, 2); ball(LX, LY - 11, 9, 2); ball(LX, LY - 4, 5, 2); orb(LX, LY - 11, 10);
  if (R.left > 0 && R.state !== 'tally') {
    const on = aim && !aim.cancel, grow = clamp(1 - R.cool / .22, .2, 1), a = on ? aim.a : Math.PI / 2, st = on ? 3 : 1 + Math.sin(now * 3) * .8;
    const r = (4 + lv('fat') * .7) * grow;
    ball(LX + Math.cos(a) * st, LY + 2 + Math.sin(a) * st, r); ball(LX, LY - 1, r * .7);
    orb(LX + Math.cos(a) * st, LY + 2 + Math.sin(a) * st, r + 1.5);
  }
}
function preview(a, bright) {   // dotted path of a shot at angle a
  const g = { x: LX + Math.cos(a) * 8, y: LY + Math.sin(a) * 8, vx: Math.cos(a) * SPEED, vy: Math.sin(a) * SPEED, r: 4 + lv('fat') * .7, plough: 0 };
  let after = -1; const steps = 90 + lv('aim') * 60, extra = 8 + lv('aim') * 26;
  for (let i = 0; i < steps; i++) {
    if (stepBall(g, STEP, false) && after < 0) after = i;
    if (after >= 0 && i - after > extra) break;
    if (g.y > pool.top(g.x)) break;
    if (i % 5 === (now * 24 | 0) % 5) { const big = i < 30 && after < 0 ? 2 : 1; ctx.fillStyle = after >= 0 ? '#74bcff' : bright ? '#ffffff' : '#8f8cd0'; ctx.fillRect(g.x | 0, g.y | 0, big, big); }
  }
}
function post() {
  const tb = R.balls[0];
  for (const p of R.pods) {
    if (p.dead || p.born < .18) continue; const x = Math.round(p.x + p.ox), y = Math.round(p.y + p.oy);
    if (p.type === 'bomb') { ctx.fillStyle = (now * 4 | 0) & 1 ? '#fff' : '#ffc944'; ctx.fillRect(x - 2, y, 5, 1); ctx.fillRect(x, y - 2, 1, 5); ctx.fillRect(x - 1, y - 1, 3, 3); continue; }
    const h = hits(p);
    if (h > 1) num(x + .5, y + .5, Math.min(99, h), p.type === 'gold' ? '#4f2f0c' : '#1c1147');
    else {   // one-hit pods get a sleepy little face that watches the drop
      const lx = tb ? clamp((tb.x - x) / 30, -1, 1) | 0 : 0, sq = Math.abs(p.sv) > 3 || (now + p.ph) % 4.2 < .13;
      ctx.fillStyle = p.type === 'gold' ? '#4f2f0c' : '#1c1147';
      ctx.fillRect(x - 2 + lx, y - (sq ? 0 : 1), 1, sq ? 1 : 2); ctx.fillRect(x + 1 + lx, y - (sq ? 0 : 1), 1, sq ? 1 : 2);
    }
  }
  for (const r of R.rings) ring(r.x, r.y, r.r, r.c);
  for (const s of R.sparks) { ctx.fillStyle = s.life > .2 ? '#ffffff' : '#b8e6ff'; ctx.fillRect(s.x | 0, s.y | 0, 1, 1); if (s.life > .3) { ctx.fillRect(s.x - 1 | 0, s.y | 0, 3, 1); ctx.fillRect(s.x | 0, s.y - 1 | 0, 1, 3); } }
  for (const b of R.balls) if (!b.mini) eyes(b.x, b.y - .5, 1, clamp(b.vx * .01, -1, 1), clamp(b.vy * .006, -1, 1), false);
  if (R.left > 0 && R.state !== 'tally') {
    const on = aim && !aim.cancel, a = on ? aim.a : Math.PI / 2; eyes(LX + Math.cos(a) * 2, LY + 1.5 + Math.sin(a) * 2, 1, 0, 0, now % 3.6 < .13, on);
    if (R.state === 'play') {
      if (on) preview(aim.a, true);
      else if (!aim && S.rounds === 0 && R.shots === 0) preview(Math.PI / 2 + Math.sin(now * 1.3) * .75, false);   // show a newcomer what aiming does
    }
  }
}

// ══════════════════════════ UI ══════════════════════════
let shownGoo = 0, theme = -1;
const ui = {
  round() {
    if (BOT) return;
    const th = (S.layer - 1) % THEMES.length; if (th !== theme) { theme = th; setTheme(th); }
    $('depth').textContent = 'depth ' + S.layer + (S.pearls ? ' · ' + S.pearls + '◦' : '');
    this.pips(); this.bar(); this.combo();
    if (S.rounds === 0) { $('hint').textContent = 'drag to aim, let go to drop'; $('hint').classList.add('on'); }
  },
  pips() { if (BOT) return; const n = Math.max(maxDrops(), R.left); $('pips').innerHTML = Array.from({ length: n }, (_, i) => `<i class="dot${i >= R.left ? ' used' : ''}"></i>`).join(''); },
  bar() { if (BOT) return; const rem = R.total - R.popped; $('bar').firstChild.style.width = (R.total ? R.popped / R.total * 100 : 0) + '%'; $('left').textContent = rem ? rem + (rem === 1 ? ' pod left' : ' pods left') : 'all popped!'; },
  combo() {
    if (BOT) return; const c = $('combo');
    if (R.combo >= 3) { c.innerHTML = R.combo + '<small>combo</small>'; c.classList.add('on'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
    else c.classList.remove('on');
  },
  shop() {
    if (BOT) return; const p = R.prev, news = UP.filter(u => u.depth && open(u) && !S.seen[u.id]).map(u => u.name);
    $('res').firstChild.textContent = p ? '+' + fmt(p.got) : 'upgrades';
    $('res').lastChild.innerHTML = !p ? '' : p.cleared ? `<em>depth ${S.layer} reached</em>` + (news.length ? `<br>new: ${news.join(', ')}` : '')
      : p.left <= 3 ? `<em>${p.left} left. so close!</em><br>pop them all in one round` : `popped ${p.pct}% · best ${S.best}%<br>pop them all in one round to go deeper`;
    this.cards(); $('cards').scrollTop = 0; $('combo').classList.remove('on'); $('sheet').classList.add('open'); sfx.sheet(true);
  },
  cards(boughtId) {
    const box = $('cards'), y = box.scrollTop; box.innerHTML = '';
    const isNew = u => u.depth && !S.seen[u.id], opened = UP.filter(open), locked = UP.filter(u => !open(u));
    for (const u of [...opened.filter(isNew), ...opened.filter(u => !isNew(u))]) {
      const l = lv(u.id), c = cost(u), maxed = l >= u.max, can = !maxed && S.goo >= c, el = document.createElement('div');
      el.className = `card ${u.cat} ${maxed ? 'maxed' : can ? 'can' : 'poor'}${isNew(u) ? ' fresh' : ''}${u.id === boughtId ? ' bought' : ''}`;
      const pips = u.max <= 7 ? `<span class="pipr">${Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'f' : ''}"></i>`).join('')}</span>` : `<span class="lvl">lv ${l}</span>`;
      el.innerHTML = `<div class="t"><div class="n">${u.name}${isNew(u) ? '<span class="tag">new</span>' : ''}</div><div class="d">${u.desc}</div>${pips}</div><button>${maxed ? 'max' : fmt(c)}</button>`;
      const b = el.lastChild; if (!can && !maxed) b.style.setProperty('--p', Math.min(100, S.goo / c * 100) + '%');
      b.onclick = () => buy(u);
      box.appendChild(el);
    }
    if (locked.length) { const el = document.createElement('div'); el.className = 'card locked'; el.innerHTML = `<div class="t"><div class="n">? ? ?</div><div class="d">something new waits at depth ${locked[0].depth}</div></div>`; box.appendChild(el); }
    const pe = pearlsFor(S.layer);
    if (pe > 0) {
      const el = document.createElement('div'); el.className = 'card pearl';
      el.innerHTML = `<div class="t"><div class="n">drain the pool</div><div class="d">start again from depth 1 with ${pe} pearl${pe > 1 ? 's' : ''}. each pearl: +50% goo, forever</div></div><button>drain</button>`;
      el.lastChild.onclick = () => { if (!confirm(`Start over from depth 1 and keep ${pe} pearl${pe > 1 ? 's' : ''}?`)) return; S = Object.assign(S, { goo: 0, layer: 1, best: 0, up: {}, seen: {}, sure: {}, pearls: S.pearls + pe }); save(); sfx.clear(); newRound({ got: 0, pct: 0, left: 9, cleared: true, combo: 0, total: 1 }); };
      box.appendChild(el);
    }
    const rs = document.createElement('button'); rs.id = 'reset'; rs.textContent = 'erase everything and start over';
    rs.onclick = () => { if (confirm('Erase all progress?')) { try { localStorage.removeItem(SAVE); } catch (_) {} location.reload(); } };
    box.appendChild(rs);
    box.scrollTop = y;
  },
};
// purchases show up on the waiting board at once
function buy(u) {
  const c = cost(u); if (!open(u) || lv(u.id) >= u.max || S.goo < c) { sfx.deny(); return false; }
  S.goo -= c; S.up[u.id] = lv(u.id) + 1;
  const plain = R.pods.filter(p => !p.dead && !p.type), pick = () => plain[Math.random() * plain.length | 0];
  if (u.id === 'power') for (const p of R.pods) p.sv += 10 + Math.random() * 6;
  if (u.id === 'gold' && plain.length) toType(pick(), 'gold');
  if (u.id === 'bomb' && plain.length) toType(pick(), 'bomb');
  if (u.id === 'tad') S.sure.tad = 1;
  if (u.id === 'drops') R.left = maxDrops();
  save(); sfx.buy(lv(u.id)); buzz(12); if (!BOT) { ui.cards(u.id); ui.pips(); }
  return true;
}
$('go').onclick = () => { initAudio(); $('sheet').classList.remove('open'); startPlay(); sfx.tap(); sfx.sheet(false); };
$('shopBtn').onclick = () => { initAudio(); if (R.state !== 'play' || R.shots) return; R.state = 'shop'; aim = null; aimId = null; ui.shop(); };
$('mute').onclick = () => { initAudio(); muted = (muted + 1) % 3; applyMute(); sfx.tap(); save(); };
applyMute();

// aiming: touch anywhere and the shot points from the tap toward your finger.
// Slide up past the tap to cancel. Only the first finger aims.
function aimAt(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * GW, y = (e.clientY - r.top) / r.height * GH;
  aim = { a: clamp(Math.atan2(Math.max(LY + 6, y) - LY, x - LX), .09 * Math.PI, .91 * Math.PI), cancel: y < LY - 8 };
}
cv.addEventListener('pointerdown', e => {
  initAudio(); held = true; if (R.state !== 'play' || aimId !== null) return;
  aimId = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (_) {} aimAt(e);
});
cv.addEventListener('pointermove', e => { if (e.pointerId === aimId) aimAt(e); });
cv.addEventListener('pointerup', e => {
  held = false; if (e.pointerId !== aimId) return; aimId = null; aimAt(e);
  if (!aim.cancel && R.state === 'play' && R.left > 0 && !fire(aim.a)) R.pending = aim.a;   // a tap that lands a moment early still counts
  aim = null;
});
cv.addEventListener('pointercancel', () => { aim = null; aimId = null; held = false; });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { last = performance.now(); if (ac) document.hidden ? ac.suspend() : ac.resume(); });

// ══════════════════════════ loop ══════════════════════════
let last = performance.now(), uiT = 0;
function frame(t) {
  const dt = Math.min(1 / 30, (t - last) / 1000); last = t;
  if (AUTO) autoFire();
  const waiting = R.state === 'play' && R.left === 0 && R.balls.length > 0;
  for (let k = held && waiting ? 3 : 1; k > 0; k--) update(dt);   // hold a finger down to hurry the last drops along
  f.globalCompositeOperation = 'source-over'; f.fillStyle = '#000'; f.fillRect(0, 0, GW, GH);
  f.globalCompositeOperation = 'lighter'; orbs.length = 0;
  draw(); render(dt); post();
  shakeAmt *= Math.pow(.0005, dt);
  cv.style.transform = shakeAmt > .3 ? `translate(${rnd(-1, 1) * shakeAmt}px,${rnd(-1, 1) * shakeAmt}px)` : '';
  const target = S.goo; shownGoo += (target - shownGoo) * Math.min(1, dt * 14); if (Math.abs(target - shownGoo) < .6) shownGoo = target;
  $('goo').textContent = fmt(Math.round(shownGoo));
  if ((uiT -= dt) <= 0) {
    uiT = .1;
    $('haul').textContent = R.got > 0 && R.state !== 'shop' ? '+' + fmt(R.got) : '';
    $('shopBtn').classList.toggle('on', R.state === 'play' && R.shots === 0 && S.rounds > 0);
    $('ff').classList.toggle('on', waiting && R.sinceShot > 3.5);
  }
  requestAnimationFrame(frame);
}

function autoFire() { if (R.state === 'play' && R.left > 0 && R.cool <= 0 && R.t > .8) { fire(rnd(.3, .7) * Math.PI); aim = R.left > 0 ? { a: 1.1 } : null; } }
// headless balance bot: plays N rounds with rough aim and buys the cheapest thing
function runBot(n) {
  const log = []; let secs = 0; newRound();
  for (let k = 0; k < n; k++) {
    const me = R, h0 = (R.pods.reduce((a, p) => a + hits(p), 0) / R.total).toFixed(1), L = S.layer; let steps = 0;
    R.state = 'play'; R.left = maxDrops(); R.value = fieldValue();
    while (R === me && steps++ < 60 * 120) {
      if (R.state === 'play' && R.left > 0 && R.cool <= 0 && R.t > .7) { const live = R.pods.filter(p => !p.dead), p = live[Math.random() * live.length | 0]; fire(clamp((p ? Math.atan2(p.y - LY, p.x - LX) : 1.57) + rnd(-.12, .12), .3, 2.84)); }
      update(1 / 60);
    }
    if (R === me) { log.push(`r${k + 1} STUCK ${R.state} left=${R.left} balls=${R.balls.length} drops=${R.drops.length} q=${R.queue.length} pend=${R.pending} t=${R.t.toFixed(0)}`); newRound({ got: 0, pct: 0, left: 9 }); }
    secs += steps / 60 + 5;
    const p = R.prev, bought = [];
    for (;;) { const c = UP.filter(u => open(u) && lv(u.id) < u.max && cost(u) <= S.goo).sort((a, b) => cost(a) - cost(b))[0]; if (!c) break; buy(c); bought.push(c.id); }
    log.push(`r${k + 1} h=${h0} t=${(secs / 60).toFixed(1)}m L${L}${p.cleared ? '*' : ''} pods=${me.total} pop=${p.pct}% combo=${p.combo} got=${p.got} goo=${S.goo} buy=${bought.join(',')}`);
  }
  $('botlog').textContent = log.join('\n');
}

fit(); addEventListener('resize', () => { if (fit() && R) { pool = makePool(); if (!R.shots) newRound(R.prev); } });
if (BOT) runBot(BOT); else {
  newRound(); shownGoo = S.goo;
  if (AUTO) { document.documentElement.classList.add('still'); const me = R; for (let i = 0; i < 60 * (+params.get('auto') || 3) && R === me; i++) { autoFire(); update(1 / 60); }
    if (R !== me) { for (let i = 0; i < 40; i++) update(1 / 60); if (R.state === 'play') { S.goo += 40; R.state = 'shop'; ui.shop(); } } }   // pre-roll for screenshots
  requestAnimationFrame(frame);
}
</script>
</body>
