<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloop.in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07081a; --panel:#101133; --line:#262258; --ink:#f4ecd8; --dim:#6f6aa8; --blue:#3f8cff; --sky:#b8e6ff; --navy:#0a1a52; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.35 'Pixelify Sans',ui-monospace,Menlo,monospace;
         display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px 8px; min-height:100vh;
         user-select:none; -webkit-user-select:none; }
  h1 { margin:0; font-size:26px; font-weight:600; letter-spacing:.06em; }
  h1 i { display:inline-block; width:.42em; height:.42em; margin:0 .06em; border-radius:50%; background:var(--blue);
         box-shadow:inset -2px -2px 0 #1f47c9, inset 2px 2px 0 var(--sky), 0 0 0 2px var(--navy); }
  nav { display:flex; gap:8px; }
  button { font:inherit; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:6px;
           padding:5px 12px; cursor:pointer; text-align:left; box-shadow:0 3px 0 #04051a; transition:transform .05s, border-color .1s; }
  button:hover:not(:disabled) { border-color:var(--blue); }
  button:active:not(:disabled) { transform:translateY(3px); box-shadow:none; }
  button:disabled { color:var(--dim); cursor:default; }
  nav button.on { background:var(--blue); color:#06103a; border-color:var(--sky); }
  #stage { position:relative; width:min(96vw,1000px); aspect-ratio:16/10; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; border:3px solid var(--line);
           border-radius:10px; cursor:crosshair; touch-action:none; box-shadow:0 0 0 3px #04051a, 0 12px 40px #0008; }
  #hud { position:absolute; top:12px; left:16px; pointer-events:none; text-shadow:2px 2px 0 #07081a; }
  #goo { font-size:30px; font-weight:600; display:flex; align-items:center; gap:8px; }
  #goo::before { content:''; width:16px; height:16px; border-radius:50%; background:var(--blue);
                 box-shadow:inset -3px -3px 0 #1f47c9, inset 3px 3px 0 var(--sky), 0 0 0 2px var(--navy); }
  #sub { color:var(--sky); font-size:15px; white-space:pre; }
  #shop { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:7px; align-items:stretch; }
  #shop button { font-size:14px; background:#101133e8; display:flex; justify-content:space-between; gap:14px; }
  #shop button:not(:disabled) { border-color:#3f8cff; color:#fff; }
  #shop button b { font-weight:600; color:var(--sky); }
  #shop button:disabled b { color:var(--dim); }
  .pop { position:absolute; pointer-events:none; font-weight:600; font-size:17px; color:var(--sky); text-shadow:2px 2px 0 #07081a;
         transform:translate(-50%,-50%); animation:pop .9s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes pop { 0%{opacity:0; margin-top:6px; scale:.5} 15%{opacity:1; scale:1.25} 30%{scale:1} 100%{opacity:0; margin-top:-34px} }
  #hint { color:var(--dim); max-width:min(96vw,760px); text-align:center; min-height:2.8em; font-size:15px; }
</style>
</head>
<body>
<h1>bloop<i></i>in</h1>
<nav id="tabs"></nav>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"><div id="goo"></div><div id="sub"></div></div>
  <div id="shop"></div>
</div>
<div id="hint"></div>

<script>
// ══════════════════════════ goo renderer ══════════════════════════
// Goo is splatted additively into a small offscreen field (one colour channel
// per goo type). Each pixel is then shaded from the field's value and slope:
// outline, rim light, shade, deep core and a specular glint, with ordered
// dither between tones. Everything gloopy on screen goes through ball()/slab().
const W = 384, H = 240, T = 128, TAU = Math.PI * 2, W4 = W * 4;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const fc = document.createElement('canvas'); fc.width = W; fc.height = H;
const f = fc.getContext('2d', { willReadFrequently: true });

function sprite(rgb) {
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  for (let i = 0; i <= 12; i++) { const t = i / 12; gr.addColorStop(t, `rgba(${rgb},${(1 - t * t) ** 2})`); }
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
}
const SPR = [sprite('255,0,0'), sprite('0,255,0'), sprite('0,0,255')];
const SOLID = ['#f00', '#0f0', '#00f'];
// r = visible radius of a lone ball; ch = goo type (0 blue, 1 coral, 2 gold)
function ball(x, y, r, ch = 0) { if (r <= 0) return; const R = r * 1.85; f.drawImage(SPR[ch], x - R, y - R, R * 2, R * 2); }
function slab(x, y, w, h, ch = 0) { f.fillStyle = SOLID[ch]; f.fillRect(x, y, w, h); }

const abgr = h => { const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; };
// tones: 0 outline, 1 shade, 2 core, 3 body, 4 light, 5 rim, 6 glint
const PAL = [
  ['#0a1a52', '#1f47c9', '#2f6cf0', '#3f8cff', '#74bcff', '#b8e6ff', '#ffffff'],
  ['#521338', '#c93a6a', '#f0557d', '#ff7190', '#ffa3ad', '#ffd6d0', '#ffffff'],
  ['#4f2f0c', '#d98a1c', '#f2b02c', '#ffc944', '#ffe07a', '#fff3bf', '#ffffff'],
].map(p => p.map(abgr));
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

// static dithered backdrop: vertical gradient + soft bokeh + vignette
const RAMP = ['#07081a', '#0a0b22', '#0d0e2b', '#111235', '#15153f', '#1a1949', '#201e55'].map(abgr);
const bgBuf = new Uint32Array(W * H), bgSh = new Uint32Array(W * H);
{
  const bokeh = [[60, 50, 46], [300, 70, 60], [190, 150, 70], [350, 200, 44], [40, 190, 50], [150, 30, 30]];
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    let s = 1.6 + 2.6 * y / H;
    for (const [bx, by, br] of bokeh) { const d = Math.hypot(x - bx, y - by); if (d < br) s += 1.3 * (1 - d / br); }
    const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
    s -= 1.6 * Math.max(0, dx * dx + dy * dy - .6);
    const k = Math.max(0, Math.min(6, Math.floor(s + BAY[(y & 3) << 2 | (x & 3)] / 16)));
    bgBuf[i] = RAMP[k]; bgSh[i] = RAMP[Math.max(0, k - 2)];
  }
}
const specks = [...Array(36)].map(() => ({ x: Math.random() * W, y: Math.random() * H, s: 2 + Math.random() * 5 }));
const SPECK = abgr('#34337a');
const out = ctx.createImageData(W, H), o32 = new Uint32Array(out.data.buffer);
// optional extra shading hints, set by the current demo each frame:
// surf[x] = y of a pool surface (goo below it is banded by depth);
// orbs = big round bodies that get lit like a sphere, with a glint.
const surfArr = new Float32Array(W); let surf = null; const orbs = [];
const orb = (x, y, R) => orbs.push({ x, y, R, R2: R * R });

function render(dt) {
  const d = f.getImageData(0, 0, W, H).data;
  o32.set(bgBuf);
  for (const s of specks) { s.y -= s.s * dt; if (s.y < 0) { s.y = H - 1; s.x = Math.random() * W; } o32[(s.y | 0) * W + (s.x | 0)] = SPECK; }
  const sh = (4 * W + 3) * 4;
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    const p = i << 2; let c = -1, m = T - 1;
    if (d[p] > m) { c = 0; m = d[p]; }
    if (d[p + 1] > m) { c = 1; m = d[p + 1]; }
    if (d[p + 2] > m) { c = 2; }
    if (c < 0) {
      // outside: outline hugging the goo, else soft drop shadow, else backdrop
      let o = -1, q;
      if (x > 0) { q = p - 4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && x < W - 1) { q = p + 4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && y > 0) { q = p - W4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && y < H - 1) { q = p + W4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o >= 0) o32[i] = PAL[o][0];
      else if (x >= 3 && y >= 4) { q = p - sh; if (d[q] >= T || d[q + 1] >= T || d[q + 2] >= T) o32[i] = bgSh[i]; }
      continue;
    }
    const pc = p + c, v = d[pc], P = PAL[c];
    const gx = (x < W - 2 ? d[pc + 8] : v) - (x > 1 ? d[pc - 8] : v);
    const gy = (y < H - 2 ? d[pc + 2 * W4] : v) - (y > 1 ? d[pc - 2 * W4] : v);
    const b = (.6 * gx + .8 * gy) / (Math.sqrt(gx * gx + gy * gy) + 20) + (BAY[(y & 3) << 2 | (x & 3)] / 16 - .5) * .28;
    let t = 3;
    if (b > .5) t = v < T + 40 ? 5 : v < T + 105 ? 4 : 3;
    else if (b > .12) t = v < T + 55 ? 4 : 3;
    else if (b < -.45) t = v < T + 80 ? 1 : 3;
    else if (b < -.1 && v < T + 30) t = 1;
    if (t === 3 && v >= 253) t = 2;
    if (b > .74 && v > T + 52 && v < T + 92) t = 6;
    if (t === 3 || t === 2) {
      const dz = BAY[(y & 3) << 2 | (x & 3)] / 16 - .5;
      if (c === 0 && surf && y - surf[x] > 2) { const dd = y - surf[x] + dz * 7; t = dd < 8 ? 4 : dd < 19 ? 3 : dd < 40 ? 2 : 1; }
      else for (const o of orbs) {
        const dx = x - o.x, dy = y - o.y;
        if (dx * dx + dy * dy < o.R2) {
          const nd = (-.6 * dx - .8 * dy) / o.R + dz * .3;
          t = nd > .52 ? 4 : nd > .02 ? 3 : nd > -.5 ? 2 : 1;
          const hx = dx + .36 * o.R, hy = dy + .42 * o.R, hr = .17 * o.R;
          if (hx * hx + hy * hy * 1.6 < hr * hr) t = 6;
          else { const kx = dx + .1 * o.R, ky = dy + .62 * o.R; if (kx * kx + ky * ky < hr * hr * .16) t = 6; }
          break;
        }
      }
    }
    o32[i] = P[t];
  }
  ctx.putImageData(out, 0, 0);
}

// little pixel eyes, drawn on top of the goo
function eyes(x, y, s, lx = 0, ly = 0, blink = false, wide = false) {
  const w = Math.max(1, Math.round(s)), h = blink ? 1 : Math.max(2, Math.round(s * (wide ? 2.1 : 1.6))), gap = Math.max(2, Math.round(s * 2.4));
  const ex = Math.round(x + lx), ey = Math.round(y + ly - h / 2);
  ctx.fillStyle = '#0a1a52';
  ctx.fillRect(ex - gap / 2 - w | 0, ey, w, h); ctx.fillRect(ex + gap / 2 | 0, ey, w, h);
  if (!blink && w >= 2) { ctx.fillStyle = '#fff'; ctx.fillRect(ex - gap / 2 - w | 0, ey, 1, 1); ctx.fillRect(ex + gap / 2 | 0, ey, 1, 1); }
}

// ══════════════════════════ juice ══════════════════════════
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : Math.floor(n).toLocaleString();
const mouse = { x: W / 2, y: H / 2, down: false };
const $ = id => document.getElementById(id);
let now = 0, shakeAmt = 0;
const shake = a => { shakeAmt = Math.min(7, Math.max(shakeAmt, a)); };
const blinking = () => now % 3.6 < .13;

function popup(x, y, text, color) {
  const st = $('stage'); if (st.querySelectorAll('.pop').length > 22) return;
  const e = document.createElement('div'); e.className = 'pop'; e.textContent = text;
  e.style.left = x / W * 100 + '%'; e.style.top = y / H * 100 + '%'; if (color) e.style.color = color;
  e.onanimationend = () => e.remove(); st.appendChild(e);
}

// audio: every sound is a pitched water-drop "bloop" on a pentatonic scale
let ac, master, lastB = 0;
function initAudio() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .9;
    const comp = ac.createDynamicsCompressor(), dl = ac.createDelay(), fb = ac.createGain(), lp = ac.createBiquadFilter();
    dl.delayTime.value = .19; fb.gain.value = .3; lp.frequency.value = 1700;
    master.connect(comp); comp.connect(ac.destination);
    master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(comp);
  } catch (_) { ac = null; }
}
const note = i => 220 * 2 ** (([0, 2, 4, 7, 9][i % 5] + 12 * Math.floor(i / 5)) / 12);
function bloop(freq = 440, dur = .16, vol = .12) {
  if (!ac) return; const t = ac.currentTime; if (t - lastB < .022) return; lastB = t;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq * .55, t); o.frequency.exponentialRampToValueAtTime(freq, t + .045);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
const arpeggio = (from, n) => { for (let i = 0; i < n; i++) setTimeout(() => bloop(note(from + i), .3, .14), i * 75); };

// loose flecks of goo: splashes, trails, bursts
function stepBits(bits, dt, floorY) {
  for (const b of bits) {
    if (b.g) b.vy += b.g * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r -= dt * (b.shrink || 6);
    if (floorY && b.y > floorY(b.x) && b.vy > 0) b.r = 0;
  }
  return bits.filter(b => b.r > .4);
}
function burst(bits, x, y, n, speed, ch = 0, g = 300, up = false) {
  for (let i = 0; i < n; i++) {
    const a = up ? rnd(-Math.PI * .85, -Math.PI * .15) : rnd(0, TAU), v = rnd(.4, 1) * speed;
    bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(1.6, 3.2), ch, g, shrink: 3.5 });
  }
}

// a pool of goo with a springy surface. Its depth is the bank balance.
function makePool() {
  const n = W / 4 + 1;
  return {
    n, h: new Float32Array(n), v: new Float32Array(n), base: 9,
    depthFor: goo => Math.min(84, 9 + 10 * Math.log2(1 + goo / 12)),
    update(dt, goo) {
      const { h, v } = this; this.base += (this.depthFor(goo) - this.base) * Math.min(1, dt * 3);
      for (let i = 0; i < n; i++) { const l = i ? h[i - 1] : h[i], r = i < n - 1 ? h[i + 1] : h[i]; v[i] += (-50 * h[i] + 260 * (l + r - 2 * h[i]) - 1.8 * v[i]) * dt; }
      for (let i = 0; i < n; i++) h[i] = clamp(h[i] + v[i] * dt, -this.base + 2, 30);
    },
    top(x) { const q = clamp(x / 4, 0, n - 1.001), i = q | 0, t = q - i; return H - this.base - (this.h[i] * (1 - t) + this.h[i + 1] * t); },
    splash(x, pow) { const c = Math.round(x / 4); for (let k = -3; k <= 3; k++) { const i = c + k; if (i >= 0 && i < n) this.v[i] -= pow * (1 - Math.abs(k) / 4); } },
    draw() { for (let x = 0; x < W; x += 2) { const y = this.top(x + 1) + Math.sin(now * 1.6 + x * .09) * .7; slab(x, y, 2, H - y + 1); surfArr[x] = surfArr[x + 1] = y; } },
  };
}

// ══════════════════════════ 1 · DEW ══════════════════════════
// A cold window covered in dew. Sweep a drop through it and it swallows
// everything it touches; let go and it runs down into the pool.
const dew = {
  name: 'DEW',
  hint: 'Drag across the glass. Your drop slurps up every bead it touches and gets fatter. Let go and it runs down into the pool — the pool is your bank. Beads that grow heavy run down by themselves.',
  init() {
    Object.assign(this, { goo: 0, cond: 0, rich: 0, reach: 0, acc: 0, dots: [], runs: [], bits: [], held: null, pool: makePool() });
    for (let i = 0; i < 300; i++) this.addDot(true);
  },
  sub() { return this.held ? `holding ${fmt(this.held.m * (1 + this.rich))}` : ''; },
  shop: [
    { label: s => `more dew`, lv: s => s.cond, cost: s => 25 * 1.6 ** s.cond, buy: s => s.cond++ },
    { label: s => `richer dew`, lv: s => s.rich, cost: s => 60 * 2.2 ** s.rich, buy: s => s.rich++ },
    { label: s => `wider slurp`, lv: s => s.reach, cost: s => 40 * 1.9 ** s.reach, can: s => s.reach < 6, buy: s => s.reach++ },
  ],
  rr: m => Math.min(16, 1.1 * Math.sqrt(m) + .7),
  addDot(seed) {
    const x = rnd(5, W - 5), y = rnd(12, H - this.pool.base - 10);
    if (this.dots.length >= 560) { const d = this.dots[Math.random() * this.dots.length | 0]; return this.grow(d); }
    for (const d of this.dots) if (Math.abs(d.x - x) < d.r + 1.6 && Math.hypot(d.x - x, d.y - y) < d.r + 1.4) return this.grow(d);
    const m = seed ? 1 + (Math.random() ** 3 * 7 | 0) : 1;
    this.dots.push({ x, y, m, r: 1.1 * Math.sqrt(m) + .4 });
  },
  grow(d) {
    d.m++; d.r = 1.1 * Math.sqrt(d.m) + .4;
    if (d.m >= 12) { d.dead = true; this.runs.push({ x: d.x, y: d.y, vx: 0, vy: 0, m: d.m, n: 0, ph: rnd(0, 6), trail: 0 }); }
  },
  down() { this.held = { x: mouse.x, y: mouse.y, vx: 0, vy: 0, m: 2, n: 0, ph: rnd(0, 6), trail: 0, held: true }; this.runs.push(this.held); bloop(note(0), .12, .08); },
  up() { if (this.held) { this.held.held = false; this.held = null; } },
  update(dt) {
    const pool = this.pool;
    this.acc += dt * 9 * 1.45 ** this.cond;
    while (this.acc >= 1) { this.acc--; this.addDot(); }
    for (const r of this.runs) {
      const rr = this.rr(r.m);
      if (r.held) {
        r.vx += ((mouse.x - r.x) * 110 - r.vx * 13) * dt; r.vy += ((mouse.y - r.y) * 110 - r.vy * 13) * dt;
      } else {
        const vt = Math.min(210, 55 + r.m * 1.6);
        r.vy += (vt - r.vy) * 2.2 * dt; r.vx += (Math.sin(now * 4 + r.ph) * 16 - r.vx) * 5 * dt;
        r.trail -= r.vy * dt;
        if (r.trail <= 0) { r.trail = 3; this.bits.push({ x: r.x, y: r.y - rr * .7, vx: 0, vy: 0, r: rr * .5, ch: 0, shrink: 5 }); }
      }
      r.x = clamp(r.x + r.vx * dt, 3, W - 3); r.y += r.vy * dt;
      const reach = rr + 2 + this.reach * 2.5;
      for (const d of this.dots) {
        if (d.dead) continue;
        const dx = d.x - r.x, dy = d.y - r.y;
        if (dx * dx + dy * dy < (reach + d.r) ** 2) {
          d.dead = true; r.m += d.m; r.n++;
          this.bits.push({ x: d.x, y: d.y, vx: -dx * 9, vy: -dy * 9, r: d.r, ch: 0, shrink: 14 });
          bloop(note(Math.min(14, r.n >> 2)), .13, .07);
        }
      }
      if (r.y + rr * .5 > pool.top(r.x)) {   // plop into the pool
        const pay = Math.round(r.m * (1 + this.rich));
        this.goo += pay; r.dead = true; if (r === this.held) this.held = null;
        pool.splash(r.x, Math.min(190, 30 + r.m * 2.2));
        burst(this.bits, r.x, pool.top(r.x) - 1, Math.min(12, 3 + r.m / 5 | 0), Math.min(170, 60 + r.m * 1.5), 0, 320, true);
        popup(r.x, pool.top(r.x) - 12, '+' + fmt(pay));
        shake(Math.min(4, r.m / 18)); bloop(note(Math.min(9, r.n >> 3)) / 2, .28, Math.min(.2, .08 + r.m / 300));
      }
    }
    for (const d of this.dots) if (!d.dead && d.y > pool.top(d.x) - 2) { d.dead = true; this.goo += d.m; }
    this.dots = this.dots.filter(d => !d.dead); this.runs = this.runs.filter(r => !r.dead);
    this.bits = stepBits(this.bits, dt, x => pool.top(x) + 2);
    pool.update(dt, this.goo);
  },
  draw() {
    this.pool.draw();
    for (const d of this.dots) ball(d.x, d.y, d.r);
    for (const b of this.bits) ball(b.x, b.y, b.r, b.ch);
    for (const r of this.runs) {
      const rr = this.rr(r.m); ball(r.x, r.y, rr); if (rr > 5) orb(r.x, r.y, rr + 1);
      if (r.held) { ball(r.x - r.vx * .028, r.y - r.vy * .028, rr * .78); ball(r.x - r.vx * .055, r.y - r.vy * .055, rr * .5); }
      else ball(r.x, r.y - rr * .85, rr * .6);
    }
  },
  post() {
    for (const r of this.runs) {
      const rr = this.rr(r.m); if (rr < 4.5) continue;
      const l = Math.hypot(r.vx, r.vy) || 1, k = Math.min(1, l / 60) * rr * .2;
      eyes(r.x, r.y - rr * .1, rr * .17, r.vx / l * k, r.vy / l * k, blinking(), r.held);
    }
  },
};

// ══════════════════════════ 2 · JELLY ══════════════════════════
// One big jelly you can grab, stretch and throw. It eats the rain.
const FLOOR = H - 14, GRAV = 430;
const jelly = {
  name: 'JELLY',
  hint: 'Grab the jelly and throw it — it squashes, wobbles and gobbles every drop it touches. Click anywhere else to make it hop there. The jelly is your wallet: spending shrinks it. Fill it up, then SPLIT.',
  init() {
    Object.assign(this, { goo: 6, goal: 250, mult: 1, rain: 0, sweet: 0, acc: 0, combo: 0, comboT: 0, pend: 0, munch: 0, grab: false, beads: [], bits: [], babies: [],
      b: { x: W / 2, y: FLOOR - 30, vx: 0, vy: 0, pvx: 0, pvy: 0, R: 14, nodes: [...Array(20)].map((_, i) => ({ a: i / 20 * TAU, off: 0, v: 0 })) } });
  },
  sub() { return `fill to ${fmt(this.goal)}` + (this.mult > 1 ? `   ×${this.mult}` : '') + (this.combo > 4 ? `\ncombo ${this.combo}` : ''); },
  shop: [
    { label: s => `heavier rain`, lv: s => s.rain, cost: s => 20 * 1.6 ** s.rain, buy: s => s.rain++ },
    { label: s => `sweeter drops`, lv: s => s.sweet, cost: s => 50 * 2 ** s.sweet, buy: s => s.sweet++ },
    { label: s => `baby jelly`, lv: s => s.babies.length, cost: s => 80 * 1.8 ** s.babies.length, can: s => s.babies.length < 6, buy: s => s.baby() },
    { label: s => `SPLIT  ×${s.mult * 2}`, cost: s => s.goal, free: true, buy: s => s.split() },
  ],
  val() { return (1 + this.sweet) * this.mult; },
  baby() { const b = this.b; this.babies.push({ x: b.x, y: b.y - 6, vx: rnd(-90, 90), vy: -180, cd: rnd(.4, 1.2), air: true }); },
  split() {
    const b = this.b;
    burst(this.bits, b.x, b.y, 34, 300, 0, 380);
    this.goo = 6; this.mult *= 2; this.goal *= 3; if (this.babies.length < 6) this.baby();
    for (const n of b.nodes) n.v += rnd(-120, 120);
    shake(7); arpeggio(2, 7); popup(b.x, b.y - 24, `×${this.mult}!`, '#fff');
  },
  impact(s, an) {
    const b = this.b; for (const n of b.nodes) n.v -= s * .55 * Math.cos(2 * (n.a - an));
    if (s > 150) { shake(Math.min(4, s / 170)); bloop(70 + rnd(0, 20), .22, Math.min(.25, s / 2200)); }
    if (s > 260) burst(this.bits, b.x + Math.cos(an) * b.R * .7, b.y + Math.sin(an) * b.R * .7, 5, s * .3, 0, 380);
  },
  eat(d, x, y) {
    d.dead = true; const v = this.val(); this.goo += v;
    this.combo++; this.comboT = .8; this.pend += v; bloop(note(Math.min(14, this.combo >> 1)), .14, .08);
  },
  down() {
    const b = this.b;
    if (Math.hypot(mouse.x - b.x, mouse.y - b.y) < b.R + 10) { this.grab = true; bloop(note(3), .1, .08); }
    else if (b.y > FLOOR - b.R * 1.6) { b.vx = clamp((mouse.x - b.x) * 2.2, -330, 330); b.vy = -clamp(160 + (FLOOR - mouse.y) * 1.6, 160, 420); this.impact(140, Math.PI / 2); bloop(note(1), .16, .1); }
  },
  up() { if (this.grab) { this.grab = false; const b = this.b, l = Math.hypot(b.vx, b.vy); if (l > 720) { b.vx *= 720 / l; b.vy *= 720 / l; } } },
  update(dt) {
    const b = this.b, R = b.R;
    b.R += (Math.min(44, 10 + 32 * Math.log(1 + this.goo) / Math.log(1 + this.goal)) - b.R) * Math.min(1, dt * 6);
    if ((this.comboT -= dt) <= 0) { if (this.pend) popup(b.x, b.y - R - 8, '+' + fmt(this.pend), this.combo >= 10 ? '#fff' : null); this.combo = 0; this.pend = 0; }
    this.munch -= dt;

    // body
    if (this.grab) { b.vx += ((mouse.x - b.x) * 130 - b.vx * 15) * dt; b.vy += ((mouse.y - b.y) * 130 - b.vy * 15) * dt; }
    else b.vy += GRAV * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const cr = R * .72;
    if (b.y > FLOOR - cr) { b.y = FLOOR - cr; if (b.vy > 50) this.impact(b.vy, Math.PI / 2); b.vy = (!this.grab && b.vy > 90) ? -b.vy * .42 : 0; if (!this.grab) b.vx *= 1 - Math.min(1, 5 * dt); }
    if (b.y < cr) { b.y = cr; if (b.vy < -50) this.impact(-b.vy, -Math.PI / 2); b.vy = this.grab ? 0 : -b.vy * .4; }
    if (b.x < cr) { b.x = cr; if (b.vx < -50) this.impact(-b.vx, Math.PI); b.vx = this.grab ? 0 : -b.vx * .5; }
    if (b.x > W - cr) { b.x = W - cr; if (b.vx > 50) this.impact(b.vx, 0); b.vx = this.grab ? 0 : -b.vx * .5; }

    // rim: inertia makes it lag behind the body, neighbours pass the wobble around
    let ax = (b.vx - b.pvx) / dt, ay = (b.vy - b.pvy) / dt - (this.grab ? 0 : GRAV);
    const al = Math.hypot(ax, ay); if (al > 1600) { ax *= 1600 / al; ay *= 1600 / al; }
    b.pvx = b.vx; b.pvy = b.vy;
    const N = b.nodes.length;
    for (let i = 0; i < N; i++) {
      const n = b.nodes[i], l = b.nodes[(i + N - 1) % N].off, r = b.nodes[(i + 1) % N].off, c = Math.cos(n.a), s = Math.sin(n.a);
      const idle = Math.sin(now * 2.2 + i * 1.3) * R * .035;
      n.v += (-210 * (n.off - idle) + 130 * (l + r - 2 * n.off) - 6.5 * n.v - (ax * c + ay * s) * .7 * R / 20) * dt;
    }
    for (const n of b.nodes) {
      n.off = clamp(n.off + n.v * dt, -R * .5, R * .6);
      const c = Math.cos(n.a), s = Math.sin(n.a); let max = 1e9;
      if (s > .15) max = Math.min(max, (FLOOR - b.y) / s - R); else if (s < -.15) max = Math.min(max, b.y / -s - R);
      if (c > .15) max = Math.min(max, (W - b.x) / c - R); else if (c < -.15) max = Math.min(max, b.x / -c - R);
      if (n.off > max) { n.off = Math.max(max, -R * .5); if (n.v > 0) n.v = 0; }
    }

    // rain
    this.acc += dt * 2.6 * 1.4 ** this.rain;
    while (this.acc >= 1) { this.acc--; if (this.beads.length < 140) this.beads.push({ x: rnd(6, W - 6), y: -4, vy: rnd(20, 60), r: 2.7 }); }
    for (const d of this.beads) {
      if (!d.rest) { d.vy += 300 * dt; d.y += d.vy * dt; if (d.y > FLOOR - 2.4) { d.y = FLOOR - 2.4; d.rest = true; } }
      const dx = d.x - b.x, dy = d.y - b.y;
      if (dx * dx + dy * dy < (R + 3) ** 2) {
        this.eat(d, d.x, d.y); this.munch = .16;
        const a = Math.atan2(dy, dx); for (const n of b.nodes) n.v += 55 * Math.max(0, Math.cos(n.a - a)) ** 6;
      }
    }

    // babies hop toward the nearest drop and eat for you
    for (const k of this.babies) {
      k.vy += GRAV * dt; k.x += k.vx * dt; k.y += k.vy * dt;
      if (k.x < 5) { k.x = 5; k.vx = Math.abs(k.vx); } else if (k.x > W - 5) { k.x = W - 5; k.vx = -Math.abs(k.vx); }
      if (k.y > FLOOR - 4.5) {
        k.y = FLOOR - 4.5; k.vy = 0; k.vx *= 1 - Math.min(1, 8 * dt);
        if (k.air) { k.air = false; k.sq = 1; }
        if ((k.cd -= dt) <= 0) {
          let best = null, bd = 1e9;
          for (const d of this.beads) if (d.rest && !d.dead) { const q = Math.abs(d.x - k.x); if (q < bd) { bd = q; best = d; } }
          k.cd = rnd(.5, 1.1); k.air = true; k.vy = -rnd(130, 190);
          k.vx = best ? clamp((best.x - k.x) * 1.5, -110, 110) : rnd(-60, 60);
        }
      }
      k.sq = Math.max(0, (k.sq || 0) - dt * 5);
      for (const d of this.beads) if (!d.dead && Math.abs(d.x - k.x) < 8 && Math.abs(d.y - k.y) < 8) this.eat(d, d.x, d.y);
    }
    this.beads = this.beads.filter(d => !d.dead);
    this.bits = stepBits(this.bits, dt, () => FLOOR);
  },
  draw() {
    const b = this.b, R = b.R;
    for (const d of this.beads) { ball(d.x, d.y, d.r); if (!d.rest) ball(d.x, d.y - 3, d.r * .6); }
    for (const q of this.bits) ball(q.x, q.y, q.r, q.ch);
    for (const k of this.babies) { ball(k.x, k.y + k.sq, 5 + k.sq); ball(k.x, k.y - clamp(k.vy * .014, -3, 3), 4); orb(k.x, k.y, 6.5); }
    ball(b.x, b.y, R * .78); orb(b.x, b.y, R * 1.12);
    for (const n of b.nodes) { const q = R * .58 + n.off; ball(b.x + Math.cos(n.a) * q, b.y + Math.sin(n.a) * q, R * .42); }
  },
  post() {
    ctx.fillStyle = '#0a0b22'; ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.fillStyle = '#2b2a6e'; ctx.fillRect(0, FLOOR, W, 1);
    ctx.fillStyle = '#15153f'; for (let x = 6; x < W; x += 16) ctx.fillRect(x, FLOOR + 4 + (x % 3), 5, 1);
    const b = this.b, R = b.R, dx = mouse.x - b.x, dy = mouse.y - b.y, l = Math.hypot(dx, dy) || 1, k = Math.min(1, l / 50) * R * .16;
    const ex = b.x + dx / l * k, ey = b.y - R * .1 + dy / l * k, es = Math.max(2, R * .15);
    eyes(ex, ey, es, 0, 0, blinking() && !this.grab, this.grab);
    ctx.fillStyle = '#ff7190'; const bw = Math.max(2, Math.round(es * 1.2)), bo = Math.round(es * 3.1);
    ctx.fillRect(Math.round(ex - bo - bw / 2), Math.round(ey + es * 1.5), bw, 1); ctx.fillRect(Math.round(ex + bo - bw / 2), Math.round(ey + es * 1.5), bw, 1);
    if (this.munch > 0) { ctx.fillStyle = '#0a1a52'; const mw = Math.max(2, Math.round(es * 1.6)); ctx.fillRect(Math.round(ex - mw / 2), Math.round(ey + es * 2.2), mw, Math.max(1, Math.round(es))); }
    for (const q of this.babies) eyes(q.x, q.y - 1, 1, clamp(q.vx * .02, -1, 1), 0, blinking());
  },
};

// ══════════════════════════ 3 · CHIME ══════════════════════════
// A goo music box. Drips ring every peg they hit; the longer a drop's
// run of notes, the more it is worth when it lands in the pool.
const chime = {
  name: 'CHIME',
  hint: 'Drag the gold pegs around, or click empty space to add one. Each peg rings a note (low on the left, high on the right). A drop is worth more for every peg it rings on the way down — build a run.',
  init() {
    Object.assign(this, { goo: 0, rate: 0, rich: 0, maxPegs: 7, emit: .5, ps: [], rings: [], bits: [], drag: null, pool: makePool(),
      pegs: [[150, 62], [234, 62], [108, 100], [192, 100], [276, 100], [150, 140]].map(([x, y]) => this.peg(x, y)) });
  },
  peg: (x, y) => ({ x, y, ox: 0, oy: 0, vx: 0, vy: 0, pulse: 0 }),
  sub() { return `pegs ${this.pegs.length}/${this.maxPegs}`; },
  shop: [
    { label: s => `faster drip`, lv: s => s.rate, cost: s => 20 * 1.6 ** s.rate, buy: s => s.rate++ },
    { label: s => `richer goo`, lv: s => s.rich, cost: s => 45 * 2 ** s.rich, buy: s => s.rich++ },
    { label: s => `another peg`, lv: s => s.maxPegs - 7, cost: s => 30 * 1.5 ** (s.maxPegs - 7), can: s => s.maxPegs < 16, buy: s => s.maxPegs++ },
  ],
  gap() { return .34 / (1 + this.rate * .45); },
  fx() { return W / 2 + Math.sin(now * .6) * 96; },
  down() {
    let g = this.pegs.find(g => Math.hypot(g.x - mouse.x, g.y - mouse.y) < 12);
    if (!g && this.pegs.length < this.maxPegs) { g = this.peg(mouse.x, mouse.y); g.pulse = 1; this.pegs.push(g); bloop(note(g.x / W * 10 | 0), .2, .1); }
    this.drag = g || null;
  },
  up() { this.drag = null; },
  update(dt) {
    const ps = this.ps, pool = this.pool;
    if (this.drag) { this.drag.x = clamp(mouse.x, 8, W - 8); this.drag.y = clamp(mouse.y, 28, H - pool.base - 14); }
    if ((this.emit -= dt) <= 0 && ps.length < 230) { this.emit = this.gap(); ps.push({ x: this.fx() + rnd(-.5, .5), y: 13, vx: rnd(-4, 4), vy: 25, hits: 0, cd: 0 }); }
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {   // sticky + springy = viscous
      const a = ps[i], b = ps[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < 72 && d2 > .01) { const d = Math.sqrt(d2), fo = (d < 5.2 ? (5.2 - d) * 60 : -(d - 5.2) * 9) * dt / d; a.vx -= dx * fo; a.vy -= dy * fo; b.vx += dx * fo; b.vy += dy * fo; }
    }
    for (const p of ps) {
      p.vy += 190 * dt; p.vx *= 1 - 1.4 * dt; p.vy *= 1 - .6 * dt; p.cd -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 3) { p.x = 3; p.vx = Math.abs(p.vx) * .4; } else if (p.x > W - 3) { p.x = W - 3; p.vx = -Math.abs(p.vx) * .4; }
      for (const g of this.pegs) {
        const px = g.x + g.ox, py = g.y + g.oy, dx = p.x - px, dy = p.y - py, d = Math.hypot(dx, dy) || .01, min = 8.6;
        if (d < min) {
          const nx = dx / d, ny = dy / d, vn = p.vx * nx + p.vy * ny;
          p.x = px + nx * min; p.y = py + ny * min;
          if (vn < 0) {
            p.vx -= 1.55 * vn * nx; p.vy -= 1.55 * vn * ny;
            if (vn < -32 && p.cd <= 0) {
              p.hits++; p.cd = .12; g.pulse = 1; g.vx += nx * vn * 1.1; g.vy += ny * vn * 1.1;
              this.rings.push({ x: px, y: py, r: 7, life: .4 });
              bloop(note(clamp(g.x / W * 10 | 0, 0, 9)), .34, .085);
            }
          }
        }
      }
      if (p.y > pool.top(p.x)) {
        const pay = (1 + this.rich) * (1 + p.hits); this.goo += pay; p.dead = true;
        pool.splash(p.x, 13 + p.hits * 5);
        if (p.hits >= 2) { popup(p.x, pool.top(p.x) - 10, '+' + fmt(pay), p.hits >= 4 ? '#ffe07a' : null); burst(this.bits, p.x, pool.top(p.x) - 1, 1 + p.hits, 50 + p.hits * 14, 0, 320, true); }
        if (p.hits >= 4) shake(1.5);
      }
    }
    this.ps = ps.filter(p => !p.dead);
    for (const g of this.pegs) {
      g.vx += (-320 * g.ox - 9 * g.vx) * dt; g.vy += (-320 * g.oy - 9 * g.vy) * dt;
      g.ox = clamp(g.ox + g.vx * dt, -5, 5); g.oy = clamp(g.oy + g.vy * dt, -5, 5); g.pulse = Math.max(0, g.pulse - dt * 4);
    }
    for (const r of this.rings) { r.life -= dt; r.r += 42 * dt; }
    this.rings = this.rings.filter(r => r.life > 0);
    this.bits = stepBits(this.bits, dt, x => pool.top(x) + 2);
    pool.update(dt, this.goo);
  },
  draw() {
    this.pool.draw();
    const fx = this.fx(), grow = 1 - clamp(this.emit / this.gap(), 0, 1);
    ball(fx, 3, 8, 2); ball(fx, 10 + grow * 2, 1 + grow * 2.6);
    for (const p of this.ps) ball(p.x, p.y, 3.1);
    for (const b of this.bits) ball(b.x, b.y, b.r, b.ch);
    for (const g of this.pegs) ball(g.x + g.ox, g.y + g.oy, 5.6 + g.pulse * 2.4, 2);
  },
  post() {
    for (const r of this.rings) {
      ctx.fillStyle = r.life > .2 ? '#fff3bf' : '#d98a1c';
      const n = Math.max(10, r.r * 1.6 | 0); for (let i = 0; i < n; i += 2) { const a = i / n * TAU; ctx.fillRect(r.x + Math.cos(a) * r.r | 0, r.y + Math.sin(a) * r.r | 0, 1, 1); }
    }
  },
};

// ══════════════════════════ shell ══════════════════════════
const demos = [dew, jelly, chime];
let cur, buttons = [];
const AUTO = location.search.includes('auto');

function start(i) {
  cur = demos[i]; cur.init(); mouse.down = false;
  [...$('tabs').children].forEach((b, k) => b.classList.toggle('on', k === i));
  $('hint').textContent = cur.hint; $('shop').innerHTML = '';
  buttons = (cur.shop || []).map(it => {
    const b = document.createElement('button'); b.innerHTML = '<span></span><b></b>';
    b.onclick = () => { const c = it.cost(cur); if (cur.goo < c) return; if (!it.free) cur.goo -= c; it.buy(cur); arpeggio(4, 3); };
    $('shop').appendChild(b); return [b, it];
  });
  history.replaceState(null, '', '#' + (i + 1));
}
demos.forEach((d, i) => { const b = document.createElement('button'); b.textContent = `${i + 1} ${d.name}`; b.onclick = () => start(i); $('tabs').appendChild(b); });
addEventListener('keydown', e => { const i = +e.key - 1; if (demos[i]) start(i); });

function pos(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; }
cv.addEventListener('pointerdown', e => { if (!ac) initAudio(); cv.setPointerCapture(e.pointerId); pos(e); mouse.down = true; cur.down && cur.down(); });
cv.addEventListener('pointermove', pos);
const release = e => { if (!mouse.down) return; pos(e); mouse.down = false; cur.up && cur.up(); };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

function step(dt) {
  now += dt;
  if (AUTO) {   // scripted input, for headless screenshots
    mouse.x = W / 2 + Math.sin(now * 1.7) * 150; mouse.y = 95 + Math.sin(now * 2.9) * 70;
    const want = now % 3 < 2.2; if (want !== mouse.down) { mouse.down = want; want ? cur.down && cur.down() : cur.up && cur.up(); }
  }
  cur.update(dt);
}
let last = performance.now();
function frame(t) {
  const dt = Math.min(1 / 30, (t - last) / 1000); last = t;
  step(dt);
  f.globalCompositeOperation = 'source-over'; f.fillStyle = '#000'; f.fillRect(0, 0, W, H);
  f.globalCompositeOperation = 'lighter';
  orbs.length = 0; surf = cur.pool ? surfArr : null;
  cur.draw(); render(dt); cur.post && cur.post();
  shakeAmt *= Math.pow(.0005, dt);
  cv.style.transform = shakeAmt > .3 ? `translate(${rnd(-1, 1) * shakeAmt}px,${rnd(-1, 1) * shakeAmt}px)` : '';
  $('goo').textContent = fmt(cur.goo); $('sub').textContent = cur.sub ? cur.sub() : '';
  for (const [b, it] of buttons) {
    const c = it.cost(cur), ok = !it.can || it.can(cur);
    const left = it.label(cur) + (it.lv ? `  ${it.lv(cur)}` : ''), right = ok ? fmt(c) : 'max';
    if (b.firstChild.textContent !== left) b.firstChild.textContent = left;
    if (b.lastChild.textContent !== right) b.lastChild.textContent = right;
    b.disabled = !ok || cur.goo < c;
  }
  requestAnimationFrame(frame);
}
start(clamp((+location.hash.slice(1) || 1) - 1, 0, demos.length - 1));
if (AUTO) for (let i = 0; i < 60 * (+new URLSearchParams(location.search).get('auto') || 8); i++) step(1 / 60);
requestAnimationFrame(frame);
</script>
</body>
