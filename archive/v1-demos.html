<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloop — goo demos</title>
<style>
  :root { --bg:#120f1f; --ink:#d6ffe6; --dim:#6b638f; --line:#2b2447; --goo:#5ef2a0; --pink:#ff5e9c; --gold:#ffd23f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;
         display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 8px; min-height:100vh; user-select:none; }
  h1 { margin:0; font-size:15px; letter-spacing:.35em; color:var(--goo); }
  nav { display:flex; gap:6px; }
  button { font:inherit; color:var(--ink); background:#1b1530; border:2px solid var(--line); border-radius:4px;
           padding:5px 10px; cursor:pointer; text-align:left; }
  button:hover:not(:disabled) { border-color:var(--goo); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button:disabled { color:var(--dim); cursor:default; }
  nav button.on { background:var(--goo); color:#120f1f; border-color:var(--goo); }
  #stage { position:relative; width:min(96vw,960px); aspect-ratio:16/10; }
  canvas { width:100%; height:100%; display:block; image-rendering:pixelated; border:2px solid var(--line);
           border-radius:6px; cursor:crosshair; touch-action:none; }
  #hud { position:absolute; top:10px; left:14px; pointer-events:none; font-size:15px; text-shadow:2px 2px 0 #120f1f; white-space:pre; }
  #shop { position:absolute; top:10px; right:10px; display:flex; flex-direction:column; gap:5px; }
  #shop button { font-size:12px; background:#1b1530e0; }
  #hint { color:var(--dim); max-width:min(96vw,960px); text-align:center; min-height:2.8em; }
</style>
</head>
<body>
<h1>BLOOP</h1>
<nav id="tabs"></nav>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="shop"></div>
</div>
<div id="hint"></div>

<script>
// ───────────────────────── goo renderer ─────────────────────────
// Blobs are splatted additively into a tiny offscreen "field" (one colour
// channel per goo type), then thresholded into a 3-tone bevelled palette.
const W = 320, H = 200, T = 128, TAU = Math.PI * 2;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const fc = document.createElement('canvas'); fc.width = W; fc.height = H;
const f = fc.getContext('2d', { willReadFrequently: true });

function sprite(rgb) {
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  for (let i = 0; i <= 12; i++) { const t = i / 12; gr.addColorStop(t, `rgba(${rgb},${(1 - t * t) ** 2})`); }
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
}
const SPR = [sprite('255,0,0'), sprite('0,255,0'), sprite('0,0,255')];
// r = visible radius of a lone ball; ch = goo type (0 mint, 1 pink, 2 gold)
function ball(x, y, r, ch = 0) { if (r <= 0) return; const R = r * 1.85; f.drawImage(SPR[ch], x - R, y - R, R * 2, R * 2); }

const abgr = h => { const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; };
const PAL = [ // [body, highlight, shade]
  ['#5ef2a0', '#d6ffe6', '#1f9c6b'],
  ['#ff5e9c', '#ffd0e2', '#b02a63'],
  ['#ffd23f', '#fff5c2', '#c48a12'],
].map(p => p.map(abgr));
const BG = abgr('#1b1530'), BGDOT = abgr('#2b2447'), BGSH = abgr('#0f0b1c');
const out = ctx.createImageData(W, H), o32 = new Uint32Array(out.data.buffer);

function render() {
  const d = f.getImageData(0, 0, W, H).data;
  const up = (2 * W + 2) * 4, sh = (4 * W + 3) * 4;
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    const p = i << 2; let c = -1, m = T - 1;
    if (d[p] > m) { c = 0; m = d[p]; }
    if (d[p + 1] > m) { c = 1; m = d[p + 1]; }
    if (d[p + 2] > m) { c = 2; }
    if (c >= 0) {
      const a = (x >= 2 && y >= 2) ? d[p - up + c] : 0;
      if (a < T) o32[i] = PAL[c][1];
      else { const b = (x < W - 2 && y < H - 2) ? d[p + up + c] : 0; o32[i] = b < T ? PAL[c][2] : PAL[c][0]; }
    } else {
      let s = false;
      if (x >= 3 && y >= 4) { const q = p - sh; s = d[q] >= T || d[q + 1] >= T || d[q + 2] >= T; }
      o32[i] = s ? BGSH : ((x & 7) === 4 && (y & 7) === 4 ? BGDOT : BG);
    }
  }
  ctx.putImageData(out, 0, 0);
}

// ───────────────────────── helpers ─────────────────────────
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : Math.floor(n).toString();
const mouse = { x: W / 2, y: H / 2, down: false };

let ac, lastB = 0;
function bloop(freq = 300, dur = .12, vol = .12, up = false) {
  if (!ac) return; const t = ac.currentTime; if (t - lastB < .025) return; lastB = t;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40, up ? freq * 2 : freq * .45), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}

// ───────────────────────── demo 1: FEED ─────────────────────────
// The blob is your wallet. Squirt goo in, spend the blob itself on upgrades.
const CX = 150, CY = 104;
const feed = {
  name: 'FEED',
  hint: 'Hold the mouse to squirt goo into the blob. The blob IS your wallet — buying things shrinks it. Fill it to the goal, then SPLIT for a permanent multiplier.',
  init() {
    Object.assign(this, { goo: 5, goal: 300, mult: 1, size: 0, drp: 0, t: 0, emit: 0, dripT: 0, dripK: 0, R: 16, drops: [],
      nodes: [...Array(10)].map((_, i) => ({ a: i / 10 * TAU, off: 0, v: 0 })) });
  },
  hud() { return `GOO ${fmt(this.goo)} / ${fmt(this.goal)}\n×${this.mult}`; },
  shop: [
    { label: s => `fatter drops (lv ${s.size})`, cost: s => 10 * 1.6 ** s.size, buy: s => s.size++ },
    { label: s => `dripper (${s.drp}/8)`, cost: s => 25 * 1.7 ** s.drp, can: s => s.drp < 8, buy: s => s.drp++ },
    { label: s => `SPLIT → ×${s.mult * 2}`, cost: s => s.goal, buy: s => s.split(), free: true },
  ],
  split() {
    for (let i = 0; i < 40; i++) { const a = rnd(0, TAU), v = rnd(120, 320); this.drop(CX + Math.cos(a) * 10, CY + Math.sin(a) * 10, Math.cos(a) * v, Math.sin(a) * v, 0, .5); }
    this.goo = 5; this.mult *= 2; this.goal *= 3;
    for (let i = 0; i < 5; i++) setTimeout(() => bloop(200 + i * 120, .18, .15, true), i * 70);
  },
  drop(x, y, vx, vy, val, hold = 0) { this.drops.push({ x, y, vx, vy, val, hold, r: 2 + Math.min(4, Math.sqrt(val / this.mult + 1) * .8) }); },
  update(dt) {
    this.t += dt;
    const target = Math.min(64, 12 + 46 * Math.log(1 + this.goo) / Math.log(1 + this.goal));
    this.R += (target - this.R) * Math.min(1, dt * 6);
    if (mouse.down) {
      this.emit -= dt;
      if (this.emit <= 0) {
        this.emit = .08;
        const dx = mouse.x - CX, dy = mouse.y - CY, l = Math.hypot(dx, dy) || 1;
        this.drop(mouse.x, mouse.y, -dy / l * 70 + rnd(-15, 15), dx / l * 70 + rnd(-15, 15), (1 + this.size) * this.mult);
      }
    }
    if (this.drp) {
      this.dripT -= dt;
      if (this.dripT <= 0) {
        this.dripT = 1.1 / this.drp; this.dripK = (this.dripK + 1) % this.drp;
        const a = this.t * .5 + this.dripK / this.drp * TAU;
        this.drop(CX + Math.cos(a) * 86, CY + Math.sin(a) * 86, -Math.sin(a) * 40, Math.cos(a) * 40, (1 + this.size) * this.mult);
      }
    }
    for (const d of this.drops) {
      const dx = d.x - CX, dy = d.y - CY, l = Math.hypot(dx, dy) || 1;
      if (d.hold > 0) d.hold -= dt; else { d.vx -= dx / l * 320 * dt; d.vy -= dy / l * 320 * dt; }
      const k = 1 - 1.3 * dt; d.vx *= k; d.vy *= k; d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.hold <= 0 && l < this.R * .9) {
        d.dead = true; this.goo += d.val;
        const a = Math.atan2(dy, dx);
        for (const n of this.nodes) n.v -= 70 * Math.max(0, Math.cos(n.a - a)) ** 4 * (d.r / 4);
        if (d.val) bloop(520 - this.R * 5 + rnd(-30, 30), .1, .09);
      }
    }
    this.drops = this.drops.filter(d => !d.dead);
    this.nodes.forEach((n, i) => {
      const idle = Math.sin(this.t * 2 + i * 1.7) * 1.2;
      n.v += (-200 * (n.off - idle) - 7 * n.v) * dt; n.off += n.v * dt;
      n.off = Math.max(-this.R * .45, Math.min(this.R * .45, n.off));
    });
  },
  draw() {
    const R = this.R;
    ball(CX, CY, R * .78);
    for (const n of this.nodes) { const q = R * .5 + n.off; ball(CX + Math.cos(n.a) * q, CY + Math.sin(n.a) * q, R * .5); }
    for (const d of this.drops) ball(d.x, d.y, d.r);
    for (let k = 0; k < this.drp; k++) { const a = this.t * .5 + k / this.drp * TAU; ball(CX + Math.cos(a) * 86, CY + Math.sin(a) * 86, 3.5, 1); }
  },
};

// ───────────────────────── demo 2: DRIP ─────────────────────────
// Goo pachinko. Viscous drips string and bounce through gloopy pegs.
const drip = {
  name: 'DRIP',
  hint: 'Click to place or remove pegs. Every bloop off a peg pays out, and so does every drop that falls out the bottom — the gold strip pays ×5.',
  init() {
    Object.assign(this, { goo: 0, rate: 0, val: 1, maxPegs: 8, t: 0, emit: 0, ps: [],
      pegs: [[110, 70], [210, 70], [160, 100], [80, 130], [240, 130], [160, 150]].map(([x, y]) => ({ x, y, r: 5, pulse: 0 })) });
  },
  hud() { return `GOO ${fmt(this.goo)}\npegs ${this.pegs.length}/${this.maxPegs}`; },
  shop: [
    { label: s => `faster drip (lv ${s.rate})`, cost: s => 15 * 1.6 ** s.rate, buy: s => s.rate++ },
    { label: s => `richer goo (+${s.val})`, cost: s => 30 * 1.8 ** (s.val - 1), buy: s => s.val++ },
    { label: s => `+2 pegs`, cost: s => 20 * 1.5 ** ((s.maxPegs - 8) / 2), buy: s => s.maxPegs += 2 },
  ],
  fx() { return 160 + Math.sin(this.t * .8) * 70; },
  zx() { return 160 + Math.sin(this.t * .45) * 110; },
  down() {
    const i = this.pegs.findIndex(g => Math.hypot(g.x - mouse.x, g.y - mouse.y) < 9);
    if (i >= 0) { this.pegs.splice(i, 1); bloop(160, .1, .1); }
    else if (this.pegs.length < this.maxPegs && mouse.y > 24) { this.pegs.push({ x: mouse.x, y: mouse.y, r: 5, pulse: 1 }); bloop(260, .12, .12, true); }
  },
  update(dt) {
    this.t += dt; this.emit -= dt;
    const ps = this.ps;
    if (this.emit <= 0 && ps.length < 240) { this.emit = .22 / (1 + this.rate * .5); ps.push({ x: this.fx() + rnd(-1, 1), y: 8, vx: rnd(-5, 5), vy: 20 }); }
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {   // cohesion + repulsion = viscosity
      const a = ps[i], b = ps[j], dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < 64 && d2 > .01) {
        const d = Math.sqrt(d2), fo = (d < 5 ? (5 - d) * 60 : -(d - 5) * 9) * dt / d;
        a.vx -= dx * fo; a.vy -= dy * fo; b.vx += dx * fo; b.vy += dy * fo;
      }
    }
    const zx = this.zx();
    for (const p of ps) {
      p.vy += 170 * dt; p.vx *= 1 - 1.5 * dt; p.vy *= 1 - .6 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 3) { p.x = 3; p.vx = Math.abs(p.vx) * .4; } else if (p.x > W - 3) { p.x = W - 3; p.vx = -Math.abs(p.vx) * .4; }
      for (const g of this.pegs) {
        const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy) || .01, min = g.r + 3;
        if (d < min) {
          const nx = dx / d, ny = dy / d, vn = p.vx * nx + p.vy * ny;
          p.x = g.x + nx * min; p.y = g.y + ny * min;
          if (vn < 0) {
            p.vx -= 1.5 * vn * nx; p.vy -= 1.5 * vn * ny;
            if (vn < -35) { this.goo += this.val; g.pulse = 1; bloop(300 + (200 - g.y) * 3, .09, .07); }
          }
        }
      }
      if (p.y > H + 4) {
        const gold = Math.abs(p.x - zx) < 22; p.dead = true;
        this.goo += this.val * (gold ? 5 : 1);
        if (gold) bloop(700, .1, .09, true);
      }
    }
    this.ps = ps.filter(p => !p.dead);
    for (const g of this.pegs) g.pulse = Math.max(0, g.pulse - dt * 5);
  },
  draw() {
    ball(this.fx(), 3, 6, 2);
    for (const p of this.ps) ball(p.x, p.y, 3.2);
    for (const g of this.pegs) ball(g.x, g.y, g.r + g.pulse * 2.5, 2);
  },
  post() { ctx.fillStyle = '#ffd23f'; ctx.fillRect(Math.round(this.zx() - 22), H - 3, 44, 3); },
};

// ───────────────────────── demo 3: FLING ─────────────────────────
// You are the goo. Stretch, fling, splat, eat.
const fling = {
  name: 'FLING',
  hint: 'Drag back and release to fling yourself — you splat and stick to whatever you hit. Eat pink motes; chaining several in one flight builds a combo.',
  init() {
    Object.assign(this, { goo: 0, mag: 0, more: 0, combo: 0, t: 0, trail: 0, aim: null, bits: [], motes: [],
      p: { x: 160, y: H - 8, vx: 0, vy: 0, r: 8, stuck: true, nx: 0, ny: -1 } });
    for (let i = 0; i < 12; i++) this.mote();
  },
  hud() { return `GOO ${fmt(this.goo)}` + (this.combo > 1 ? `\ncombo ×${this.combo}` : ''); },
  shop: [
    { label: s => `magnet (lv ${s.mag})`, cost: s => 15 * 2 ** s.mag, buy: s => s.mag++ },
    { label: s => `+4 motes`, cost: s => 25 * 2 ** s.more, buy: s => { s.more++; for (let i = 0; i < 4; i++) s.mote(); } },
  ],
  mote(m = {}) { m.x = rnd(20, W - 20); m.y = rnd(20, H - 30); m.ph = rnd(0, 6); if (!this.motes.includes(m)) this.motes.push(m); },
  launchV() {
    let vx = (this.aim.x - mouse.x) * 4.5, vy = (this.aim.y - mouse.y) * 4.5; const l = Math.hypot(vx, vy);
    if (l > 420) { vx *= 420 / l; vy *= 420 / l; } return [vx, vy];
  },
  down() { if (this.p.stuck) this.aim = { x: mouse.x, y: mouse.y }; },
  up() {
    if (!this.aim) return;
    const [vx, vy] = this.launchV(), p = this.p; this.aim = null;
    if (Math.hypot(vx, vy) > 40) { p.vx = vx; p.vy = vy; p.stuck = false; this.combo = 0; bloop(170, .2, .14, true); }
  },
  stick(nx, ny) {
    const p = this.p, sp = Math.hypot(p.vx, p.vy);
    Object.assign(p, { stuck: true, nx, ny, vx: 0, vy: 0 });
    for (let i = 0; i < 9; i++) { const s = rnd(-1, 1) * sp * .35, u = rnd(.05, .3) * sp; this.bits.push({ x: p.x, y: p.y, vx: -ny * s + nx * u, vy: nx * s + ny * u, r: rnd(2, 4), ch: 0, g: 1 }); }
    bloop(110 + rnd(0, 30), .16, .2);
  },
  update(dt) {
    this.t += dt; const p = this.p;
    if (!p.stuck) {
      p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      this.trail -= dt;
      if (this.trail <= 0) { this.trail = .025; this.bits.push({ x: p.x, y: p.y, vx: 0, vy: 0, r: p.r * .6, ch: 0 }); }
      if (p.x < p.r) { p.x = p.r; this.stick(1, 0); } else if (p.x > W - p.r) { p.x = W - p.r; this.stick(-1, 0); }
      else if (p.y < p.r) { p.y = p.r; this.stick(0, 1); } else if (p.y > H - p.r) { p.y = H - p.r; this.stick(0, -1); }
    }
    for (const m of this.motes) {
      const dx = p.x - m.x, dy = p.y - m.y, d = Math.hypot(dx, dy) || 1;
      if (this.mag && d < 20 + this.mag * 22) { m.x += dx / d * 45 * dt; m.y += dy / d * 45 * dt; }
      if (d < p.r + 4) {
        this.combo++; this.goo += this.combo;
        for (let i = 0; i < 6; i++) { const a = rnd(0, TAU); this.bits.push({ x: m.x, y: m.y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, r: 2.5, ch: 1 }); }
        bloop(Math.min(1400, 380 + this.combo * 90), .1, .12, true);
        this.mote(m);
      }
    }
    for (const b of this.bits) { if (b.g) b.vy += 260 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r -= dt * (b.ch ? 9 : 7); }
    this.bits = this.bits.filter(b => b.r > .5);
    p.r += (8 + Math.min(8, Math.sqrt(this.goo) * .5) - p.r) * Math.min(1, dt * 5);
  },
  draw() {
    const p = this.p;
    for (const b of this.bits) ball(b.x, b.y, b.r, b.ch);
    for (const m of this.motes) ball(m.x, m.y + Math.sin(this.t * 2 + m.ph) * 2, 3.5, 1);
    ball(p.x, p.y, p.r);
    if (p.stuck) {   // squash against the surface
      const tx = -p.ny, ty = p.nx, o = p.r * .75, s = p.r * .35;
      ball(p.x + tx * o - p.nx * s, p.y + ty * o - p.ny * s, p.r * .65);
      ball(p.x - tx * o - p.nx * s, p.y - ty * o - p.ny * s, p.r * .65);
      if (this.aim) {   // stretch toward the pull
        let dx = mouse.x - this.aim.x, dy = mouse.y - this.aim.y; const l = Math.hypot(dx, dy) || 1, c = Math.min(l, 45) / l;
        for (let i = 1; i <= 6; i++) ball(p.x + dx * c * i / 6, p.y + dy * c * i / 6, p.r * (.85 - i * .08));
      }
    } else ball(p.x - p.vx * .02, p.y - p.vy * .02, p.r * .8);
  },
  post() {
    if (!this.aim) return;
    let [vx, vy] = this.launchV(), x = this.p.x, y = this.p.y;
    ctx.fillStyle = '#d6ffe6';
    for (let i = 0; i < 16; i++) { vy += 260 * .04; x += vx * .04; y += vy * .04; if (x < 0 || x > W || y < 0 || y > H) break; ctx.fillRect(x | 0, y | 0, 1, 1); }
  },
};

// ───────────────────────── shell ─────────────────────────
const demos = [feed, drip, fling];
let cur, buttons = [];
const $ = id => document.getElementById(id);

function start(i) {
  cur = demos[i]; cur.init(); mouse.down = false;
  [...$('tabs').children].forEach((b, k) => b.classList.toggle('on', k === i));
  $('hint').textContent = cur.hint;
  $('shop').innerHTML = '';
  buttons = (cur.shop || []).map(it => {
    const b = document.createElement('button');
    b.onclick = () => { const c = it.cost(cur); if (cur.goo < c) return; if (!it.free) cur.goo -= c; it.buy(cur); bloop(440, .12, .12, true); };
    $('shop').appendChild(b); return [b, it];
  });
}
demos.forEach((d, i) => { const b = document.createElement('button'); b.textContent = `${i + 1} ${d.name}`; b.onclick = () => start(i); $('tabs').appendChild(b); });
addEventListener('keydown', e => { const i = +e.key - 1; if (demos[i]) start(i); });

function pos(e) { const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) / r.width * W; mouse.y = (e.clientY - r.top) / r.height * H; }
cv.addEventListener('pointerdown', e => {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  cv.setPointerCapture(e.pointerId); pos(e); mouse.down = true; cur.down && cur.down();
});
cv.addEventListener('pointermove', pos);
const release = e => { if (!mouse.down) return; pos(e); mouse.down = false; cur.up && cur.up(); };
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  cur.update(dt);
  f.globalCompositeOperation = 'source-over'; f.fillStyle = '#000'; f.fillRect(0, 0, W, H);
  f.globalCompositeOperation = 'lighter';
  cur.draw(); render(); cur.post && cur.post();
  $('hud').textContent = cur.hud();
  for (const [b, it] of buttons) {
    const c = it.cost(cur), ok = !it.can || it.can(cur);
    const txt = ok ? `${it.label(cur)} · ${fmt(c)}` : `${it.label(cur)} · max`;
    if (b.textContent !== txt) b.textContent = txt;
    b.disabled = !ok || cur.goo < c;
  }
  requestAnimationFrame(frame);
}
start(0); requestAnimationFrame(frame);
</script>
</body>
