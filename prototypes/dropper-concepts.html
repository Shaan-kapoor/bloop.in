<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bloop.in · dropper concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:28px 20px 60px; background:#07081a; color:#eeedf7; font:500 16px/1.45 Fredoka, system-ui, sans-serif; }
  h1 { margin:0 0 4px; font-size:26px; } .lede { margin:0 0 26px; color:#a5a3cf; max-width:760px; }
  .row { display:flex; gap:22px; flex-wrap:wrap; }
  .card { width:300px; } canvas { width:300px; height:500px; image-rendering:pixelated; display:block; border:1px solid #3a3b78; border-radius:8px; background:#0c0d26; }
  h2 { margin:14px 0 2px; font-size:19px; } h2 b { color:#ffc944; } p { margin:0 0 8px; color:#a5a3cf; font-size:14.5px; } p b { color:#eeedf7; font-weight:600; }
  .beats { color:#6462a0; font-size:13px; letter-spacing:.04em; min-height:20px; margin-top:8px; }
</style>
<h1>Where does Bloop come from? Round two</h1>
<p class="lede">Four new directions. The first three have no hardware at all: the dropper is water, ice or a creature. Each plays its wordless intro on a loop, and the last second shows what happens in play. The moon is never shown; only the notes say who “n” is.</p>
<div class="row" id="row"></div>
<script>
const W = 180, H = 300, TAU = Math.PI * 2, LX = 90, LY = 62;
const lerp = (a, b, t) => a + (b - a) * t, cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v, ease = t => t * t * (3 - 2 * t);
const seg = (t, a, b) => ease(cl((t - a) / (b - a)));   // 0 to 1 as t goes from a to b
function kit(ctx) {
  const al = a => { ctx.globalAlpha = a; }, R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  const D = (x, y, r, c) => { ctx.fillStyle = c; for (let j = -Math.ceil(r); j <= r; j++) { const w = Math.sqrt(Math.max(0, r * r - j * j)); if (w > .3) ctx.fillRect(Math.round(x - w), Math.round(y + j), Math.round(w * 2), 1); } };
  return { R, D, al,
    sky(scroll = 0) { for (let y = 0; y < H; y += 4) R(0, y, W, 4, `rgb(${7 + y * .035 | 0},${8 + y * .035 | 0},${26 + y * .1 | 0})`);
      for (let i = 0; i < 40; i++) { const x = (i * 47) % W, y = ((i * 89 - scroll * (1 + i % 3) * .5) % H + H) % H; R(x, y, 1, 1, i % 4 ? '#3a3990' : '#8a8ae0'); } },
    pool(k) { if (k <= 0) return; ctx.globalAlpha = k; R(0, H - 14, W, 14, '#2f6cf0'); R(0, H - 14, W, 2, '#74bcff'); for (let x = 0; x < W; x += 9) R(x + Math.sin(performance.now() / 500 + x) * 2, H - 14, 4, 1, '#b8e6ff'); ctx.globalAlpha = 1; },
    pods(k) { if (k <= 0) return; ctx.globalAlpha = k; for (let r = 0; r < 4; r++) for (let c = 0; c < 4 - (r & 1); c++) { const x = 45 + c * 30 + (r & 1) * 15, y = 140 + r * 24; D(x, y + 1, 8, '#1c1147'); D(x, y, 7, '#7a66ea'); D(x - 2, y - 2, 2.2, '#d6ceff'); R(x - 3, y, 1, 1, '#1c1147'); R(x + 2, y, 1, 1, '#1c1147'); } ctx.globalAlpha = 1; },
    drop(x, y, r, eyes, lookDown) { if (r <= .5) return; D(x, y + .5, r + 1, '#0a1a52'); D(x, y, r, '#3f8cff'); D(x - r * .35, y - r * .35, r * .3, '#b8e6ff'); if (eyes > 0 && r > 3) { const h = eyes > .5 ? 2 : 1, d = lookDown ? 1 : 0; R(x - 2, y - 1 + d, 1, h, '#0a1a52'); R(x + 1, y - 1 + d, 1, h, '#0a1a52'); } },
  };
}
// Every concept shares the ending: the drop swells, wakes, looks down, the pods and pool appear, it lets go.
function ending(k, t, x, y0) {   // t counted from the moment the drop starts to form
  const grow = seg(t, 0, 1.6), wake = t > 2 ? (t % 1.3 < .12 && t < 3.6 ? .4 : 1) : 0, fall = cl((t - 5) / 1.1);
  k.pods(seg(t, 3, 4.4)); k.pool(seg(t, 3.4, 4.6));
  const y = y0 + grow * 3 + fall * fall * (H - 30 - y0);
  if (fall < 1) k.drop(x, y, 5 * grow, wake, t > 2.8);
  else if (t < 6.6) for (let i = -2; i <= 2; i++) k.R(x + i * 5, H - 16 - (1 - (t - 6.1) * 2) * 6 * (3 - Math.abs(i)), 2, 2, '#b8e6ff');
}
const B = ['#b8e6ff', '#3f8cff', '#2f6cf0', '#0a1a52'];   // blue: light, body, shade, outline
const surface = (k, t, y, amp = 1) => { for (let x = 0; x < W; x += 6) k.R(x + Math.sin(t * 1.5 + x * .2) * 2 * amp, y + Math.sin(t + x * .1) * 1.2 * amp, 4, 1, '#3766b0'); };
const CONCEPTS = [
  { name: 'The roost', tag: 'no object at all',
    story: '<b>Backstory.</b> Above the world hangs a second sea, upside down and perfectly still. Drops sleep along its underside like bats. Now and then something far away tugs at it, a ripple runs along the ceiling, and whichever drop it passes wakes up.<br><b>In play.</b> The sleepers are your drops for the round: you can count them. When one falls, the next shuffles to the middle. “+1 drop” adds a sleeper.<br><b>Reveal.</b> Nothing is shown but the ripple. Late notes say “a little of that tug is me”; the last note names who.',
    beats: ['a still ceiling of water, drops asleep', 'a ripple runs along it', 'one more drop gathers', 'it wakes', 'it looks down', 'and lets go · the next one shuffles over'],
    draw(k, t) {
      k.sky(); const wave = lerp(-25, W + 25, cl((t - 1) / 3.6)), slide = t > 12 ? seg(t, 12, 13.5) : 0;
      for (let x = 0; x < W; x++) { const h = 9 + Math.sin(x * .13 + t * 1.2) * 1.2 + Math.exp(-((x - wave) ** 2) / 90) * 3.5; k.R(x, 0, 1, h, B[1]); k.R(x, 0, 1, 3, B[2]); k.R(x, h - 2, 1, 1, '#74bcff'); k.R(x, h, 1, 1, B[3]); }
      [22, 44, 66, 114, 136, 158].forEach((x, i) => k.drop(x > LX ? x - 24 * slide : x, 14 + Math.sin(t * 1.5 + i) * .6 + Math.exp(-((x - wave) ** 2) / 90) * 3, 4.5, .4));
      ending(k, t - 4.6, LX, 13);
    } },
  { name: 'The thaw', tag: 'ice',
    story: '<b>Backstory.</b> Bloop did not begin here. It was frozen into a piece of ice a very long time ago, somewhere cold, and the ice has been drifting ever since, carried by a current nobody steers. Tonight it reached warmer water.<br><b>In play.</b> The drops left in your round are frozen inside the ice, asleep. Each drop you use melts the ice a little. A fresh piece drifts in for the next round.<br><b>Reveal.</b> “Woke up” becomes literal. Who has been carrying the ice all this way? The tide. The last note says whose tide.',
    beats: ['a piece of ice drifts in', 'drops are frozen inside it, asleep', 'the water here is warmer', 'one thaws and wakes', 'it looks down', 'and lets go · the ice melts a little'],
    draw(k, t) {
      k.sky(); surface(k, t, 3);
      const cx = lerp(-34, LX, seg(t, .4, 3)), top = 5 + Math.sin(t * 1.4) * 1.2, warm = seg(t, 3, 4.8), hgt = 42 - warm * 5 - (t > 12 ? seg(t, 12, 13.5) * 7 : 0);
      k.R(0, 0, W, 6, `rgba(255,214,150,${.14 * warm})`); let w = 0;
      for (let j = 0; j < hgt; j++) { w = 24 - Math.abs(j / 42 - .35) * 26 + ((j * 7) % 5 < 2 ? 1 : 0); const y = top + j; k.R(cx - w - 1, y - (j ? 0 : 1), w * 2 + 2, j ? 1 : 2, '#27508f'); k.R(cx - w, y, w * 2, 1, '#bfe2fa'); k.R(cx - w, y, w * .5, 1, '#eefaff'); k.R(cx + w - 4, y, 4, 1, '#86bde8'); }
      k.R(cx - w - 1, top + hgt, w * 2 + 2, 1, '#27508f');
      k.al(.7); k.drop(cx - 9, top + 12, 3.6, .4); k.drop(cx + 8, top + 19, 3.6, .4); if (t < 5.2) k.drop(cx, top + hgt - 8, 3.6, .4); k.al(1);
      ending(k, t - 5.2, LX, top + hgt + 1);
    } },
  { name: 'The old one', tag: 'a character',
    story: '<b>Backstory.</b> The biggest, oldest drop there is has hung at the top of the world for so long that it is far too big to fall. It has always wanted to know what is down there. So it lets a little of itself go, and asks to be told.<br><b>In play.</b> It is a face, not a fixture: it watches each drop fall, winces at a miss, dozes while you shop. It gives the game someone to play for.<br><b>Reveal.</b> It never speaks. The notes come from somebody else, who has been watching the old one for a very long time, and that is how “n” knows Bloop’s name.',
    beats: ['something huge, asleep', 'it opens its eyes', 'it lets a little of itself go', 'the little one wakes', 'they both look down', 'and it lets go'],
    draw(k, t) {
      k.sky(); const r = 40 + Math.sin(t * 1.3) * .8 - (t > 12 ? seg(t, 12, 13.5) * 2 : 0), cy = -10, open = seg(t, 1.2, 2.8) > .5 && t < 11.8, dn = t > 8.2 ? 1 : 0;
      k.D(LX, cy, r + 1.5, B[3]); k.D(LX, cy, r, B[2]); k.D(LX - 3, cy - 3, r - 4, B[1]); k.D(LX - 20, 9, 3.5, B[0]);
      for (const s of [-1, 1]) { const ex = LX + s * 13; if (open) { k.R(ex - 1, 14 + dn, 3, 3, B[3]); k.R(ex - 1, 14 + dn, 1, 1, '#eef4ff'); } else k.R(ex - 2, 16, 5, 1, B[3]); }
      k.R(LX - 3, 23, 6, 1, B[3]); k.R(LX - 4, 22, 1, 1, B[3]); k.R(LX + 3, 22, 1, 1, B[3]);
      ending(k, t - 5.5, LX, cy + r + 1);
    } },
  { name: 'The paper boat', tag: 'a folded note',
    story: '<b>Backstory.</b> Somebody folded a letter into a boat and set it on the water. It has drifted a long way and it is soaked through. What drips out of the bottom is water that has passed through the writing. That is why Bloop knows where to go.<br><b>In play.</b> The boat bobs on the surface and leans the way you aim. It gets soggier as your drops run out and dries between rounds.<br><b>Reveal.</b> The notes come in bottles; this one came as a boat, and you have been looking at it since the first second. After the last note the boat unfolds: it is note zero, the first one “n” ever sent.',
    beats: ['a paper boat drifts in', 'there is writing on it', 'it is soaked through', 'a drop comes out of the paper and wakes', 'it looks down', 'and lets go'],
    draw(k, t) {
      k.sky(); const P = ['#fbf6e6', '#efe6cc', '#cdc2a2', '#4b4636'], sy = 26, x = lerp(-40, LX, seg(t, .4, 3.2)), b = Math.sin(t * 1.6) * 1.2, soak = seg(t, 3.4, 5.4);
      for (let j = 0; j < 17; j++) { const w = j * .62, y = sy - 25 + j + b; k.R(x - w - 1, y, w * 2 + 2, 1, P[3]); k.R(x - w, y, w * 2, 1, P[2]); k.R(x - w, y, w, 1, P[0]); }
      for (let j = 0; j < 15; j++) { const w = 24 - j * .6, y = sy - 8 + j + b, wet = j > 14 - soak * 8; k.R(x - w - 1, y, w * 2 + 2, 1, P[3]); k.R(x - w, y, w * 2, 1, wet ? '#9fb0c8' : j ? P[1] : P[0]); k.R(x + w - 4, y, 4, 1, wet ? '#8296b3' : P[2]); }
      k.R(x - 16, sy + 7 + b, 32, 1, P[3]);
      k.R(x - 14, sy - 5 + b, 10, 1, '#8a86a8'); k.R(x - 1, sy - 5 + b, 12, 1, '#8a86a8'); k.R(x - 12, sy - 2 + b, 17, 1, '#8a86a8');
      surface(k, t, sy);
      ending(k, t - 5.5, LX, sy + 9 + b);
    } },
];
const LOOP = 14.5;
for (const c of CONCEPTS) {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<canvas width="${W}" height="${H}"></canvas><div class="beats"></div><h2>${c.name} <b>· ${c.tag}</b></h2><p>${c.story}</p>`;
  document.getElementById('row').appendChild(card); c.k = kit(card.querySelector('canvas').getContext('2d')); c.b = card.querySelector('.beats');
}
const t0 = performance.now(), fixed = +new URLSearchParams(location.search).get('t');
(function frame() {
  const t = fixed || ((performance.now() - t0) / 1000) % LOOP;
  for (const c of CONCEPTS) { c.draw(c.k, t); c.b.textContent = '· ' + c.beats[Math.min(5, t < 3 ? 0 : t < 4.2 ? 1 : t < 5.6 ? 2 : t < 8.4 ? 3 : t < 10.8 ? 4 : 5)]; }
  requestAnimationFrame(frame);
})();
</script>
</html>
