<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --u:2px; --bg:#07081a; --panel:#101133; --line:#262258; --ink:#f4ecd8; --dim:#7d78b8; --blue:#3f8cff; --sky:#b8e6ff; --navy:#0a1a52; --gold:#ffc944; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--bg); }
  body { color:var(--ink); font:calc(var(--u)*8)/1.25 'Pixelify Sans',ui-monospace,Menlo,monospace;
         user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; }
  #app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; overflow:hidden; background:#0d0e2b; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:crisp-edges; image-rendering:pixelated; }
  .ui { position:absolute; pointer-events:none; text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #07081a; }

  #hud { left:0; right:0; top:0; padding:calc(env(safe-area-inset-top) + var(--u)*4) calc(var(--u)*6) 0; display:flex; justify-content:space-between; align-items:flex-start; }
  #goo { font-size:calc(var(--u)*15); font-weight:600; display:flex; align-items:center; gap:calc(var(--u)*3); line-height:1; }
  #goo::before, .dot { content:''; display:inline-block; width:calc(var(--u)*8); height:calc(var(--u)*8); border-radius:50%; background:var(--blue);
     box-shadow:inset calc(var(--u)*-1.2) calc(var(--u)*-1.2) 0 #1f47c9, inset calc(var(--u)*1.2) calc(var(--u)*1.2) 0 var(--sky), 0 0 0 var(--u) var(--navy); }
  #right { display:flex; align-items:center; gap:calc(var(--u)*4); color:var(--sky); }
  #mute { pointer-events:auto; font:inherit; color:var(--sky); background:#101133cc; border:var(--u) solid var(--line); border-radius:calc(var(--u)*3);
          width:calc(var(--u)*17); height:calc(var(--u)*17); padding:0; }
  #bar { left:calc(var(--u)*6); right:calc(var(--u)*6); top:calc(env(safe-area-inset-top) + var(--u)*25); height:calc(var(--u)*3); background:#0a0b22; border-radius:99px; overflow:hidden; box-shadow:0 0 0 var(--u) var(--line); }
  #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#7a66ea,#b8e6ff); transition:width .25s; }
  #pips { left:calc(var(--u)*7); right:55%; top:calc(env(safe-area-inset-top) + var(--u)*33); display:flex; flex-wrap:wrap; justify-content:flex-start; gap:calc(var(--u)*2.5); }
  #pips .dot { width:calc(var(--u)*5); height:calc(var(--u)*5); transition:transform .2s, opacity .2s; }
  #pips .dot.used { opacity:.18; transform:scale(.6); }
  #combo { right:calc(var(--u)*8); top:26%; font-size:calc(var(--u)*20); font-weight:600; color:#fff; opacity:0; transition:opacity .4s; text-align:right; line-height:.9; }
  #combo small { display:block; font-size:calc(var(--u)*7); color:var(--sky); font-weight:400; }
  #combo.on { opacity:.9; } #combo.bump { animation:bump .18s; }
  @keyframes bump { 0%{transform:scale(1.5)} 100%{transform:scale(1)} }
  #hint { left:0; right:0; top:40%; text-align:center; font-size:calc(var(--u)*10); color:#fff; opacity:0; transition:opacity .4s; white-space:pre-line; }
  #hint.on { opacity:1; animation:float 1.6s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(calc(var(--u)*-3)); } }
  #toast { left:0; right:0; top:34%; text-align:center; font-size:calc(var(--u)*17); font-weight:600; color:var(--gold); opacity:0; line-height:1; white-space:pre-line; }
  #toast.on { animation:toast 2.2s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes toast { 0%{opacity:0; transform:scale(.3)} 12%{opacity:1; transform:scale(1)} 80%{opacity:1} 100%{opacity:0; transform:scale(1.1)} }
  .pop { position:absolute; pointer-events:none; font-weight:600; font-size:calc(var(--u)*9); color:var(--sky); text-shadow:var(--u) var(--u) 0 #07081a;
         transform:translate(-50%,-50%); animation:pop .9s cubic-bezier(.2,.9,.3,1) forwards; white-space:nowrap; }
  .pop.gold { color:var(--gold); font-size:calc(var(--u)*11); } .pop.big { color:#fff; font-size:calc(var(--u)*13); }
  @keyframes pop { 0%{opacity:0; margin-top:calc(var(--u)*3); scale:.5} 15%{opacity:1; scale:1.25} 30%{scale:1} 100%{opacity:0; margin-top:calc(var(--u)*-16)} }

  /* upgrade sheet: slides up from the bottom, everything within thumb reach */
  #sheet { position:absolute; left:0; right:0; bottom:0; height:68%; display:flex; flex-direction:column; background:#0b0c26f2; border-top:calc(var(--u)*1.5) solid var(--line);
           border-radius:calc(var(--u)*8) calc(var(--u)*8) 0 0; transform:translateY(102%); transition:transform .28s cubic-bezier(.2,.9,.3,1); pointer-events:auto; touch-action:pan-y; }
  #sheet.open { transform:none; }
  #res { padding:calc(var(--u)*6) calc(var(--u)*8) calc(var(--u)*3); display:flex; justify-content:space-between; align-items:baseline; gap:calc(var(--u)*4); }
  #res b { font-size:calc(var(--u)*14); color:var(--sky); } #res span { color:var(--dim); text-align:right; font-size:calc(var(--u)*7.5); }
  #cards { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:calc(var(--u)*2) calc(var(--u)*6) calc(var(--u)*4); display:flex; flex-direction:column; gap:calc(var(--u)*3); touch-action:pan-y; }
  .card { display:flex; align-items:center; gap:calc(var(--u)*4); background:var(--panel); border:var(--u) solid var(--line); border-radius:calc(var(--u)*4);
          padding:calc(var(--u)*3.5) calc(var(--u)*4); min-height:calc(var(--u)*30); }
  .card .t { flex:1; min-width:0; } .card .n { font-weight:600; font-size:calc(var(--u)*9); display:flex; align-items:center; gap:calc(var(--u)*3); }
  .card .d { color:var(--dim); font-size:calc(var(--u)*7); line-height:1.15; margin-top:calc(var(--u)*.8); }
  .pipr { display:inline-flex; gap:calc(var(--u)*.9); } .pipr i { width:calc(var(--u)*2.4); height:calc(var(--u)*2.4); border-radius:50%; background:#262258; } .pipr i.f { background:var(--blue); }
  .card button { font:inherit; font-weight:600; color:#06103a; background:var(--blue); border:0; border-radius:calc(var(--u)*3); min-width:calc(var(--u)*34); height:calc(var(--u)*22);
                 padding:0 calc(var(--u)*4); box-shadow:0 calc(var(--u)*1.5) 0 #1f47c9; }
  .card button:active { transform:translateY(calc(var(--u)*1.5)); box-shadow:none; }
  .card.poor button { background:#1b1b4a; color:var(--dim); box-shadow:0 calc(var(--u)*1.5) 0 #0a0b22; }
  .card.maxed button { background:none; color:var(--gold); box-shadow:none; }
  .card.can { border-color:var(--blue); }
  .card.locked { opacity:.5; border-style:dashed; } .card.locked .n { color:var(--dim); }
  .card.fresh { animation:fresh .6s; } .card.bought { animation:bought .35s; }
  @keyframes fresh { 0%{transform:scale(.8); border-color:#fff} 60%{transform:scale(1.04)} }
  @keyframes bought { 30%{transform:scale(1.05); background:#1f47c9} }
  .tag { font-size:calc(var(--u)*6); font-weight:600; color:#06103a; background:var(--gold); border-radius:99px; padding:0 calc(var(--u)*2.5); }
  #foot { padding:calc(var(--u)*4) calc(var(--u)*6) calc(env(safe-area-inset-bottom) + var(--u)*5); display:flex; gap:calc(var(--u)*4); align-items:center; }
  #go { flex:1; font:inherit; font-size:calc(var(--u)*13); font-weight:600; color:#06103a; background:var(--sky); border:0; border-radius:calc(var(--u)*5); height:calc(var(--u)*30);
        box-shadow:0 calc(var(--u)*2) 0 var(--blue); }
  #go:active { transform:translateY(calc(var(--u)*2)); box-shadow:none; }
  #reset { font:inherit; font-size:calc(var(--u)*6.5); color:var(--dim); background:none; border:0; padding:calc(var(--u)*4) 0; }
  #botlog { display:none; }
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="c"></canvas>
  <div id="bar" class="ui"><i></i></div>
  <div id="hud" class="ui"><div id="goo">0</div><div id="right"><span id="depth"></span><button id="mute" aria-label="sound">♪</button></div></div>
  <div id="pips" class="ui"></div>
  <div id="combo" class="ui"></div>
  <div id="hint" class="ui"></div>
  <div id="toast" class="ui"></div>
  <div id="sheet">
    <div id="res"><b></b><span></span></div>
    <div id="cards"></div>
    <div id="foot"><button id="go">DROP ▸</button><button id="reset">reset</button></div>
  </div>
</div></div>
<pre id="botlog"></pre>

<script>
'use strict';
// ══════════════════════════ screen ══════════════════════════
// Portrait-first. The game is drawn 180 logical pixels wide and as tall as
// the phone allows; all DOM UI is sized in the same logical unit (--u).
const $ = id => document.getElementById(id);
const GW = 180, W4 = GW * 4, T = 128, TAU = Math.PI * 2;
let GH = 340;
const cv = $('c'), ctx = cv.getContext('2d');
const fc = document.createElement('canvas'), f = fc.getContext('2d', { willReadFrequently: true });
let out, o32, bgBuf, bgSh, surfArr = new Float32Array(GW);

function fit() {
  const vw = innerWidth, vh = innerHeight, ratio = Math.max(1.6, Math.min(2.2, vh / vw));
  const w = Math.min(vw, vh / ratio), h = w * ratio, st = $('stage');
  st.style.width = w + 'px'; st.style.height = h + 'px';
  document.documentElement.style.setProperty('--u', w / GW + 'px');
  const gh = Math.round(GW * ratio);
  if (gh !== GH || !out) { GH = gh; cv.width = fc.width = GW; cv.height = fc.height = GH; out = ctx.createImageData(GW, GH); o32 = new Uint32Array(out.data.buffer); buildBg(); return true; }
}

// ══════════════════════════ goo renderer ══════════════════════════
// Goo is splatted additively into an offscreen field (one colour channel per
// goo type), then every pixel is shaded from the field's value and slope:
// outline, rim light, shade, deep core, glint, with ordered dither.
function sprite(rgb) {
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  for (let i = 0; i <= 12; i++) { const t = i / 12; gr.addColorStop(t, `rgba(${rgb},${(1 - t * t) ** 2})`); }
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
}
const SPR = [sprite('255,0,0'), sprite('0,255,0'), sprite('0,0,255')], SOLID = ['#f00', '#0f0', '#00f'];
// ch: 0 blue (you, droplets, pool) · 1 violet (pods) · 2 gold
function ball(x, y, r, ch = 0) { if (r <= 0) return; const R = r * 1.85; f.drawImage(SPR[ch], x - R, y - R, R * 2, R * 2); }
function slab(x, y, w, h, ch = 0) { f.fillStyle = SOLID[ch]; f.fillRect(x, y, w, h); }
const abgr = h => { const n = parseInt(h.slice(1), 16); return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | (n >> 16)) >>> 0; };
// tones: 0 outline, 1 shade, 2 core, 3 body, 4 light, 5 rim, 6 glint
const PAL = [
  ['#0a1a52', '#1f47c9', '#2f6cf0', '#3f8cff', '#74bcff', '#b8e6ff', '#ffffff'],
  ['#1c1147', '#4a35b0', '#5d49cf', '#7a66ea', '#a595ff', '#d6ceff', '#ffffff'],
  ['#4f2f0c', '#d98a1c', '#f2b02c', '#ffc944', '#ffe07a', '#fff3bf', '#ffffff'],
].map(p => p.map(abgr));
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const RAMP = ['#07081a', '#0a0b22', '#0d0e2b', '#111235', '#15153f', '#1a1949', '#201e55'].map(abgr);
function buildBg() {
  bgBuf = new Uint32Array(GW * GH); bgSh = new Uint32Array(GW * GH);
  const bokeh = [[30, GH * .2, 40], [150, GH * .32, 46], [90, GH * .6, 60], [165, GH * .82, 36], [20, GH * .78, 40]];
  for (let y = 0, i = 0; y < GH; y++) for (let x = 0; x < GW; x++, i++) {
    let s = 1.5 + 2.6 * y / GH;
    for (const [bx, by, br] of bokeh) { const d = Math.hypot(x - bx, y - by); if (d < br) s += 1.2 * (1 - d / br); }
    const dx = (x - GW / 2) / (GW / 2), dy = (y - GH / 2) / (GH / 2);
    s -= 1.5 * Math.max(0, dx * dx * .7 + dy * dy - .62);
    const k = Math.max(0, Math.min(6, Math.floor(s + BAY[(y & 3) << 2 | (x & 3)] / 16)));
    bgBuf[i] = RAMP[k]; bgSh[i] = RAMP[Math.max(0, k - 2)];
  }
}
const specks = [...Array(26)].map(() => ({ x: Math.random() * GW, y: Math.random() * 400, s: 2 + Math.random() * 5 }));
const SPECK = abgr('#34337a');
let surf = false; const orbs = [];
const orb = (x, y, R) => orbs.push({ x, y, R, R2: R * R });

function render(dt) {
  const d = f.getImageData(0, 0, GW, GH).data, W = GW, H = GH;
  o32.set(bgBuf);
  for (const s of specks) { s.y -= s.s * dt; if (s.y < 0) { s.y = H - 1; s.x = Math.random() * W; } if (s.y < H) o32[(s.y | 0) * W + (s.x | 0)] = SPECK; }
  const sh = (3 * W + 2) * 4;
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
    const p = i << 2; let c = -1, m = T - 1;
    if (d[p] > m) { c = 0; m = d[p]; }
    if (d[p + 1] > m) { c = 1; m = d[p + 1]; }
    if (d[p + 2] > m) { c = 2; }
    if (c < 0) {
      let o = -1, q;
      if (x > 0) { q = p - 4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && x < W - 1) { q = p + 4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && y > 0) { q = p - W4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o < 0 && y < H - 1) { q = p + W4; if (d[q] >= T) o = 0; else if (d[q + 1] >= T) o = 1; else if (d[q + 2] >= T) o = 2; }
      if (o >= 0) o32[i] = PAL[o][0];
      else if (x >= 2 && y >= 3) { q = p - sh; if (d[q] >= T || d[q + 1] >= T || d[q + 2] >= T) o32[i] = bgSh[i]; }
      continue;
    }
    const pc = p + c, v = d[pc], P = PAL[c], dz = BAY[(y & 3) << 2 | (x & 3)] / 16 - .5;
    const gx = (x < W - 2 ? d[pc + 8] : v) - (x > 1 ? d[pc - 8] : v);
    const gy = (y < H - 2 ? d[pc + 2 * W4] : v) - (y > 1 ? d[pc - 2 * W4] : v);
    const b = (.6 * gx + .8 * gy) / (Math.sqrt(gx * gx + gy * gy) + 20) + dz * .28;
    let t = 3;
    if (b > .5) t = v < T + 40 ? 5 : v < T + 105 ? 4 : 3;
    else if (b > .12) t = v < T + 55 ? 4 : 3;
    else if (b < -.45) t = v < T + 80 ? 1 : 3;
    else if (b < -.1 && v < T + 30) t = 1;
    if (t === 3 && v >= 253) t = 2;
    if (b > .74 && v > T + 52 && v < T + 92) t = 6;
    if (t === 3 || t === 2) {
      if (c === 0 && surf && y - surfArr[x] > 2) { const dd = y - surfArr[x] + dz * 7; t = dd < 7 ? 4 : dd < 17 ? 3 : dd < 36 ? 2 : 1; }
      else for (const o of orbs) {
        const dx = x - o.x, dy = y - o.y;
        if (dx * dx + dy * dy < o.R2) {
          const nd = (-.6 * dx - .8 * dy) / o.R + dz * .3;
          t = nd > .52 ? 4 : nd > .02 ? 3 : nd > -.5 ? 2 : 1;
          const hx = dx + .36 * o.R, hy = dy + .42 * o.R, hr = .2 * o.R;
          if (hx * hx + hy * hy * 1.6 < hr * hr) t = 6;
          break;
        }
      }
    }
    o32[i] = P[t];
  }
  ctx.putImageData(out, 0, 0);
}

// tiny pixel helpers drawn on top of the goo
function eyes(x, y, s, lx = 0, ly = 0, blink = false, wide = false) {
  const w = Math.max(1, Math.round(s)), h = blink ? 1 : Math.max(2, Math.round(s * (wide ? 2.1 : 1.6))), gap = Math.max(2, Math.round(s * 2.4));
  const ex = Math.round(x + lx), ey = Math.round(y + ly - h / 2);
  ctx.fillStyle = '#0a1a52';
  ctx.fillRect(ex - gap / 2 - w | 0, ey, w, h); ctx.fillRect(ex + gap / 2 | 0, ey, w, h);
}
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001001001', '111101111101111', '111101111001111'];
function num(x, y, n, color) {
  const s = String(n), w = s.length * 4 - 1; let ox = Math.round(x - w / 2); const oy = Math.round(y - 2.5);
  ctx.fillStyle = color;
  for (const ch of s) { const g = DIG[+ch]; for (let k = 0; k < 15; k++) if (g[k] === '1') ctx.fillRect(ox + k % 3, oy + (k / 3 | 0), 1, 1); ox += 4; }
}
function ring(x, y, r, color) {
  ctx.fillStyle = color; const n = Math.max(10, r * 1.5 | 0);
  for (let i = 0; i < n; i += 2) { const a = i / n * TAU; ctx.fillRect(x + Math.cos(a) * r | 0, y + Math.sin(a) * r | 0, 1, 1); }
}

// ══════════════════════════ juice ══════════════════════════
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = n => { n = Math.floor(n); if (n < 1e4) return n.toLocaleString(); const u = ['k', 'M', 'B', 'T', 'q', 'Q']; let i = -1; while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; } return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + u[i]; };
const params = new URLSearchParams(location.search), BOT = +params.get('bot') || 0, AUTO = params.has('auto');
let now = 0, shakeAmt = 0;
const shake = a => { shakeAmt = Math.min(7, Math.max(shakeAmt, a)); };
const buzz = ms => { if (BOT) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };
function popup(x, y, text, cls) {
  if (BOT) return; const st = $('stage'); if (st.querySelectorAll('.pop').length > 16) return;
  const e = document.createElement('div'); e.className = 'pop ' + (cls || ''); e.textContent = text;
  e.style.left = x / GW * 100 + '%'; e.style.top = y / GH * 100 + '%';
  e.onanimationend = () => e.remove(); st.appendChild(e);
}
function toast(text) { if (BOT) return; const t = $('toast'); t.textContent = text; t.classList.remove('on'); void t.offsetWidth; t.classList.add('on'); }

// audio: every sound is a pitched water-drop "bloop" on a pentatonic scale
let ac, master, lastB = 0, muted = false;
function initAudio() {
  if (ac || BOT) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : .9;
    const comp = ac.createDynamicsCompressor(), dl = ac.createDelay(), fb = ac.createGain(), lp = ac.createBiquadFilter();
    dl.delayTime.value = .19; fb.gain.value = .28; lp.frequency.value = 1700;
    master.connect(comp); comp.connect(ac.destination);
    master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(comp);
  } catch (_) { ac = null; }
}
const note = i => 220 * 2 ** (([0, 2, 4, 7, 9][i % 5] + 12 * Math.floor(i / 5)) / 12);
function bloop(freq = 440, dur = .16, vol = .12) {
  if (!ac || muted) return; if (ac.state === 'suspended') ac.resume();
  const t = ac.currentTime; if (t - lastB < .02) return; lastB = t;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(freq * .55, t); o.frequency.exponentialRampToValueAtTime(freq, t + .045);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
const arpeggio = (from, n, gap = 70) => { if (BOT) return; for (let i = 0; i < n; i++) setTimeout(() => bloop(note(from + i), .3, .13), i * gap); };

// ══════════════════════════ save + upgrades ══════════════════════════
const SAVE = 'bloopin.save.v1';
let S = { goo: 0, layer: 1, best: 0, rounds: 0, up: {}, seen: {} };
if (!BOT) try { const j = JSON.parse(localStorage.getItem(SAVE)); if (j && j.up) S = Object.assign(S, j); muted = !!S.muted; } catch (_) {}
const save = () => { if (BOT) return; try { S.muted = muted; localStorage.setItem(SAVE, JSON.stringify(S)); } catch (_) {} };
const lv = id => S.up[id] || 0;

// Every upgrade changes something you can see on the board, not just a number.
// New ones are revealed as you reach new depths.
const UP = [
  { id: 'drops',  name: 'more drops',     desc: '+1 drop every round',                  max: 7,  cost: 8,     grow: 2.7 },
  { id: 'power',  name: 'punch',          desc: 'drops hit harder: pod numbers shrink', max: 99, cost: 12,    grow: 2.15 },
  { id: 'rich',   name: 'rich goo',       desc: 'every droplet is worth more',          max: 99, cost: 15,    grow: 2.2 },
  { id: 'bounce', name: 'bouncy',         desc: 'drops keep their bounce longer',       max: 4,  cost: 10,    grow: 3 },
    { id: 'splash', name: 'splash',         desc: 'popped pods burst their neighbours',   max: 5,  cost: 30,    grow: 3.4 },
  { id: 'fat',    name: 'fat drop',       desc: 'a bigger drop is harder to miss with', max: 4,  cost: 90,    grow: 3.2, depth: 2 },
  { id: 'aim',    name: 'long sight',     desc: 'see further along your shot',          max: 2,  cost: 70,    grow: 6,   depth: 2 },
  { id: 'twin',   name: 'twins',          desc: 'a drop splits on its first hit',       max: 3,  cost: 260,   grow: 5,   depth: 3 },
  { id: 'combo',  name: 'rhythm',         desc: 'long combos make the goo richer',      max: 5,  cost: 220,   grow: 3,   depth: 3 },
  { id: 'skip',   name: 'skipping stone', desc: 'drops bounce back off the pool',       max: 3,  cost: 900,   grow: 5,   depth: 4 },
  { id: 'gold',   name: 'gold pods',      desc: 'rare gold pods worth 8×',              max: 5,  cost: 800,   grow: 3,   depth: 4 },
  { id: 'leak',   name: 'leaky tap',      desc: 'a few free little drops each round',       max: 4,  cost: 3000,  grow: 4,   depth: 5 },
  { id: 'tad',    name: 'tadpoles',       desc: 'popped pods can hatch a mini drop',    max: 5,  cost: 9000,  grow: 3.5, depth: 6 },
  { id: 'bomb',   name: 'boom pods',      desc: 'pods that blow up everything near',    max: 3,  cost: 30000, grow: 5,   depth: 7 },
  { id: 'heavy',  name: 'heavy',          desc: 'plough straight through weak pods',    max: 3,  cost: 1e5,   grow: 6,   depth: 8 },
];
const cost = u => Math.round(u.cost * (u.id === 'power' && +params.get('pg') || u.id === 'rich' && +params.get('rg') || u.grow) ** lv(u.id));
const open = u => S.layer >= (u.depth || 1);
const dmgNow = () => 1.4 ** lv('power');
const richMul = () => 1.25 ** lv('rich');
const HPG = +params.get('hpg') || 1.5, layerVal = L => 1.6 ** (L - 1);
// pods toughen fastest between depths 4 and 14, while new tricks are still arriving
const EX = +params.get('ex') || 30, hpBase = L => { const t = clamp((L - 4) / 10, 0, 1); return HPG ** (L - 1) * (1 + (EX - 1) * t * t * (3 - 2 * t)); };
const hits = p => Math.max(1, Math.ceil(p.hp / dmgNow() - 1e-6));

// ══════════════════════════ the round ══════════════════════════
const LX = GW / 2, LY = 46, SPEED = 235, GRAV = 270;
let R = null, pool = null, aim = null;

function makePool() {
  const n = GW / 4 + 1;
  return {
    n, h: new Float32Array(n), v: new Float32Array(n), base: 12,
    update(dt, depth) {
      const { h, v } = this; this.base += (depth - this.base) * Math.min(1, dt * 4);
      for (let i = 0; i < n; i++) { const l = i ? h[i - 1] : h[i], r = i < n - 1 ? h[i + 1] : h[i]; v[i] += (-50 * h[i] + 260 * (l + r - 2 * h[i]) - 1.8 * v[i]) * dt; }
      for (let i = 0; i < n; i++) h[i] = clamp(h[i] + v[i] * dt, -this.base + 3, 26);
    },
    top(x) { const q = clamp(x / 4, 0, n - 1.001), i = q | 0, t = q - i; return GH - this.base - (this.h[i] * (1 - t) + this.h[i + 1] * t); },
    splash(x, pow) { const c = Math.round(x / 4); for (let k = -3; k <= 3; k++) { const i = c + k; if (i >= 0 && i < n) this.v[i] -= pow * (1 - Math.abs(k) / 4); } },
    draw() { for (let x = 0; x < GW; x += 2) { const y = this.top(x + 1) + Math.sin(now * 1.6 + x * .09) * .7; slab(x, y, 2, GH - y + 1); surfArr[x] = surfArr[x + 1] = y; } },
  };
}
const podR = hp => 5.2 + Math.min(hp, 6) * .75;
const maxDrops = () => 3 + lv('drops');

function genField() {
  const L = S.layer, top = 84, bot = GH - 96, pods = [], mask = (L - 1) % 5;
  const rows = Math.floor((bot - top) / 17) + 1, cy = (top + bot) / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < 8; c++) {
    const x = 20 + c * 20 + (r & 1 ? 10 : 0), y = top + r * 17; if (x > GW - 14) continue;
    const nx = (x - GW / 2) / (GW / 2 - 14), ny = (y - cy) / ((bot - top) / 2), rr = Math.hypot(nx, ny);
    const keep = mask === 0 ? Math.abs(nx) + Math.abs(ny) < .9 : mask === 1 ? rr > .5 && rr < 1.02 : mask === 2 ? Math.abs(nx) > .36 && Math.abs(ny) < .85
      : mask === 3 ? Math.abs(Math.abs(nx) - Math.abs(ny)) < .34 : (r + c) % 3 !== 0;
    if (!keep) continue;
    const gold = Math.random() < .035 * lv('gold');
    const rel = gold ? .5 : .55 + Math.random() ** 2.5 * (L === 1 ? .6 : 1.1), hp = hpBase(L) * rel;
    pods.push({ x: x + rnd(-1, 1), y: y + rnd(-1, 1), hp, max: hp, rel, r: 6, type: gold ? 'gold' : '', s: 0, sv: 0, ox: 0, oy: 0, vx: 0, vy: 0, born: -(r * .035 + Math.random() * .12) });
  }
  for (let k = 0; k < lv('bomb'); k++) { const p = pods[Math.random() * pods.length | 0]; if (p && !p.type) { p.type = 'bomb'; p.rel = .5; p.hp = p.max = .5 * hpBase(L); } }
  return pods;
}

function newRound() {
  const pods = genField();
  R = { state: 'play', t: 0, pods, balls: [], drops: [], bits: [], rings: [], queue: [], total: pods.length, popped: 0, left: maxDrops(), haul: 0, got: 0,
        combo: 0, comboT: 0, best: 0, plops: 0, cool: .5, slow: 0, freeze: 0, endT: 0, leakT: 2, leaks: 0, src: null, cleared: false, shots: 0,
        value: pods.reduce((a, p) => a + p.rel * (p.type === 'gold' ? 16 : 1), 0) * layerVal(S.layer) * richMul() };
  if (!pool) pool = makePool();
  aim = null; ui.round();
}

function addBall(x, y, vx, vy, o = {}) {
  const mini = !!o.mini, r = mini ? 2.6 : 4 + lv('fat') * .7;
  R.balls.push({ x, y, vx, vy, r, dmg: dmgNow() * (mini ? .5 : 1), mini, plough: mini ? 0 : lv('heavy') * 2, leak: !!o.leak, split: mini || !!o.split, skips: mini ? 0 : lv('skip'), hits: 0, age: 0, sq: 0, trail: 0 });
}
function fire(a) {
  if (R.state !== 'play' || R.left <= 0 || R.cool > 0) return false;
  R.left--; R.shots++; R.cool = .22;
  addBall(LX + Math.cos(a) * 8, LY + Math.sin(a) * 8, Math.cos(a) * SPEED, Math.sin(a) * SPEED);
  bloop(note(0), .2, .12); buzz(8); ui.pips(); $('hint').classList.remove('on');
  return true;
}

function bitsBurst(x, y, n, speed, ch, up) {
  for (let i = 0; i < n; i++) {
    const a = up ? rnd(-Math.PI * .85, -Math.PI * .15) : rnd(0, TAU), v = rnd(.4, 1) * speed;
    R.bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(1.4, 2.6), ch, g: 300, shrink: 4.5 });
  }
}
function damage(p, dmg, nx = 0, ny = 0) {
  if (p.dead) return;
  p.hp -= dmg; p.sv += 9; p.vx += nx * 60; p.vy += ny * 60;
  if (p.hp <= 0) popPod(p); else bitsBurst(p.x, p.y, 2, 50, p.type === 'gold' ? 2 : 1);
}
function popPod(p) {
  p.dead = true; R.popped++; R.combo++; R.comboT = 1.4; R.best = Math.max(R.best, R.combo);
  const gold = p.type === 'gold', n = clamp(Math.round(p.rel * 2.4), 1, 4);
  const mul = 1 + Math.min(R.combo, 40) * .02 * lv('combo');
  const each = Math.max(1, Math.round(layerVal(S.layer) * richMul() * p.rel * (gold ? 16 : 1) / n * mul * 1.6));
  for (let i = 0; i < n; i++) R.drops.push({ x: p.x + rnd(-2, 2), y: p.y + rnd(-2, 2), vx: rnd(-55, 55), vy: rnd(-120, -30), val: each, ch: gold ? 2 : 0, r: gold ? 2.6 : 1.9 + Math.min(1, lv('rich') * .08) });
  bitsBurst(p.x, p.y, 5, 80, gold ? 2 : 1);
  R.rings.push({ x: p.x, y: p.y, r: p.r, life: .32, c: gold ? '#ffe07a' : '#d6ceff' });
  bloop(note(Math.min(14, R.combo)), .22, .1); buzz(5); ui.combo();
  if (gold) popup(p.x, p.y - 8, 'gold!', 'gold');
  if (lv('splash')) R.queue.push({ t: .075, x: p.x, y: p.y, rad: 13 + lv('splash') * 4.5, dmg: dmgNow() * .5 });
  if (p.type === 'bomb') { R.queue.push({ t: .05, x: p.x, y: p.y, rad: 40, dmg: dmgNow() * 5, boom: true }); R.freeze = .06; }
  if (lv('tad') && !(R.src && R.src.mini) && Math.random() < .06 * lv('tad')) addBall(p.x, p.y, rnd(-70, 70), -rnd(90, 150), { mini: true });
  if (R.popped === R.total && !R.cleared) {   // every pod gone in one round: go deeper
    R.cleared = true; R.slow = 1.2;
    const bonus = Math.round(R.value * (.5 + .15 * R.left)); R.left = 0;
    for (let i = 0; i < 14; i++) R.drops.push({ x: rnd(10, GW - 10), y: rnd(60, GH * .5), vx: rnd(-40, 40), vy: rnd(-90, 0), val: Math.ceil(bonus / 14), ch: 2, r: 2.6 });
    toast(`DEPTH ${S.layer}\nCLEARED`); arpeggio(5, 9, 85); shake(5); buzz([20, 40, 20, 40, 60]); ui.pips();
  }
  ui.bar();
}

function stepBall(b, dt, live) {
  b.vy += GRAV * dt; b.x += b.vx * dt; b.y += b.vy * dt;
  if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * .8; } else if (b.x > GW - b.r) { b.x = GW - b.r; b.vx = -Math.abs(b.vx) * .8; }
  if (b.y < b.r + 22) { b.y = b.r + 22; b.vy = Math.abs(b.vy) * .6; }
  const e = .6 + .07 * lv('bounce');
  for (const p of R.pods) {
    if (p.dead || p.born < .1) continue;
    const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + p.r; if (dx * dx + dy * dy >= rr * rr) continue;
    const d = Math.hypot(dx, dy) || .01, nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
    if (live && b.plough > 0 && p.hp <= b.dmg && p.type !== 'bomb') { b.plough--; hitPod(b, p, nx, ny, true); b.vx *= .95; b.vy *= .95; continue; }
    b.x = p.x + nx * rr; b.y = p.y + ny * rr;
    if (vn < 0) {
      b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
      const o = b.vx * nx + b.vy * ny; if (o < 22) { b.vx += nx * (22 - o) + (live ? rnd(-6, 6) : 0); b.vy += ny * (22 - o); }
      if (vn > -30) continue;   // a soft touch just slides off; only a real knock counts
      if (live) hitPod(b, p, nx, ny); else return true;
    }
  }
  const sp = Math.hypot(b.vx, b.vy); if (sp > 430) { b.vx *= 430 / sp; b.vy *= 430 / sp; }
}
function hitPod(b, p, nx, ny, through) {
  b.hits++; b.sq = 1;
  if (p.hp > b.dmg) { R.combo++; R.comboT = 1.4; R.best = Math.max(R.best, R.combo); bloop(note(Math.min(14, R.combo)), .14, .07); ui.combo(); }
  R.src = b; damage(p, b.dmg, -nx, -ny); R.src = null;
  if (!b.split && lv('twin')) {
    b.split = true; const sp = Math.hypot(b.vx, b.vy), a0 = Math.atan2(b.vy, b.vx);
    for (let k = 1; k <= lv('twin'); k++) { const a = a0 + (k % 2 ? 1 : -1) * .5 * Math.ceil(k / 2); addBall(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, { split: true }); }
    R.rings.push({ x: b.x, y: b.y, r: 4, life: .3, c: '#b8e6ff' }); bloop(note(7), .2, .1);
  }
}

function update(rdt) {
  now += rdt;
  if (!R) return;
  if (R.freeze > 0) { R.freeze -= rdt; return; }
  let dt = rdt; if (R.slow > 0) { R.slow -= rdt; dt *= .3; }
  R.t += dt; R.cool -= dt;
  if ((R.comboT -= dt) <= 0 && R.combo) { R.combo = 0; ui.combo(); }

  for (const p of R.pods) {
    p.born += dt; p.sv += (-260 * p.s - 9 * p.sv) * dt; p.s += p.sv * dt * .1;
    p.vx += (-300 * p.ox - 10 * p.vx) * dt; p.vy += (-300 * p.oy - 10 * p.vy) * dt; p.ox += p.vx * dt; p.oy += p.vy * dt;
    p.r += (podR(hits(p)) + (p.type === 'bomb' ? 1.5 : 0) - p.r) * Math.min(1, dt * 12);
  }
  for (const q of R.queue) if ((q.t -= dt) <= 0) {
    q.done = true; R.rings.push({ x: q.x, y: q.y, r: q.rad * .5, life: .25, c: q.boom ? '#fff3bf' : '#74bcff', grow: q.rad * 2.4 });
    if (q.boom) { shake(6); bloop(62, .4, .28); buzz(30); bitsBurst(q.x, q.y, 12, 150, 2); }
    for (const p of R.pods) if (!p.dead) { const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy); if (d < q.rad + p.r * .5) damage(p, q.dmg, dx / (d || 1), dy / (d || 1)); }
  }
  R.queue = R.queue.filter(q => !q.done);

  if (R.state === 'play' && lv('leak') && R.popped < R.total && (R.left > 0 || R.balls.some(b => !b.leak)) && R.shots > 0 && R.leaks < lv('leak') * 4 && (R.leakT -= dt) <= 0) {
    R.leaks++; R.leakT = 1.2; addBall(rnd(14, GW - 14), 26, rnd(-20, 20), 30, { mini: true, leak: true });
  }

  for (const b of R.balls) {
    b.age += dt; b.sq = Math.max(0, b.sq - dt * 6);
    for (let k = 0; k < 2; k++) stepBall(b, dt / 2, true);
    if ((b.trail -= dt) <= 0) { b.trail = .03; R.bits.push({ x: b.x, y: b.y, vx: 0, vy: 0, r: b.r * .6, ch: 0, shrink: 9 }); }
    if (b.age > 12) { b.vy += 260 * dt; b.vx *= 1 - dt; }
    if (b.y > pool.top(b.x) - b.r * .3 && b.vy > 0) {
      if (b.skips > 0) {
        b.skips--; b.vy = -Math.max(200, b.vy * .9); pool.splash(b.x, 120); bitsBurst(b.x, pool.top(b.x), 6, 110, 0, true);
        R.rings.push({ x: b.x, y: pool.top(b.x), r: 5, life: .3, c: '#b8e6ff' }); bloop(note(4), .3, .14); buzz(10);
      } else { b.dead = true; pool.splash(b.x, 90); bitsBurst(b.x, pool.top(b.x), b.mini ? 2 : 5, 90, 0, true); bloop(98, .25, b.mini ? .05 : .13); }
    }
  }
  R.balls = R.balls.filter(b => !b.dead);

  for (const d of R.drops) {
    d.vy += 300 * dt; d.vx *= 1 - dt; d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.x < 2) { d.x = 2; d.vx = Math.abs(d.vx); } else if (d.x > GW - 2) { d.x = GW - 2; d.vx = -Math.abs(d.vx); }
    if (d.y > pool.top(d.x) && d.vy > 0) {
      d.dead = true; R.haul += d.val; R.got += d.val; pool.splash(d.x, 16);
      bloop(note(5 + (R.plops++ % 10)), .07, .03);
      if (d.ch === 2) popup(d.x, pool.top(d.x) - 8, '+' + fmt(d.val), 'gold');
    }
  }
  R.drops = R.drops.filter(d => !d.dead);
  for (const b of R.bits) { if (b.g) b.vy += b.g * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r -= dt * b.shrink; if (b.vy > 0 && b.y > pool.top(clamp(b.x, 0, GW - 1)) + 2) b.r = 0; }
  R.bits = R.bits.filter(b => b.r > .4);
  for (const r of R.rings) { r.life -= dt; r.r += (r.grow || 40) * dt; }
  R.rings = R.rings.filter(r => r.life > 0);
  pool.update(dt, 12 + 54 * (1 - Math.exp(-1.6 * R.haul / Math.max(1, R.value))));

  if (R.state === 'play') {
    const idle = !R.balls.length && !R.drops.length && !R.queue.length;
    if (R.left === 0 && idle) { if ((R.endT += dt) > .4) { R.state = 'tally'; R.rate = Math.max(1, R.haul) / .8; R.tick = 0; } } else R.endT = 0;
  } else if (R.state === 'tally') {
    const amt = Math.min(R.haul, R.rate * dt); R.haul -= amt; S.goo += amt;
    if ((R.tick -= dt) <= 0 && amt > 0) { R.tick = .05; bloop(note(8 + (R.plops++ % 7)), .06, .05); }
    if (R.haul <= .001) {
      R.haul = 0; S.goo = Math.round(S.goo); S.rounds++;
      R.pct = Math.round(R.popped / R.total * 100);
      if (R.cleared) { S.layer++; S.best = 0; } else S.best = Math.max(S.best, R.pct);
      save(); R.state = 'shop'; ui.shop();
    }
  }
}

function draw() {
  surf = true; pool.draw();
  for (const p of R.pods) {
    if (p.dead) continue;
    const k = clamp(p.born / .18, 0, 1), r = p.r * (1 + p.s) * (k < 1 ? k * (1.3 - .3 * k) : 1); if (r <= 0) continue;
    const pulse = p.type === 'bomb' ? Math.sin(now * 7) * .6 : 0;
    ball(p.x + p.ox, p.y + p.oy, r + pulse, p.type === 'gold' ? 2 : 1);
    if (r > 5) orb(p.x + p.ox, p.y + p.oy, r + 1.5);
  }
  for (const d of R.drops) { ball(d.x, d.y, d.r, d.ch); ball(d.x - d.vx * .02, d.y - d.vy * .02, d.r * .6, d.ch); }
  for (const b of R.bits) ball(b.x, b.y, b.r, b.ch);
  for (const b of R.balls) {
    ball(b.x, b.y, b.r + b.sq * .8); ball(b.x - b.vx * .012, b.y - b.vy * .012, b.r * .75);
    if (b.r > 3.5) orb(b.x, b.y, b.r + 1.5);
  }
  // the tap: a gold nozzle with the next drop hanging from it
  ball(LX, LY - 11, 9, 2); ball(LX, LY - 4, 5, 2); orb(LX, LY - 11, 10);
  if (R.left > 0 && R.state === 'play') {
    const grow = clamp(1 - R.cool / .22, .2, 1), a = aim ? aim.a : Math.PI / 2, st = aim ? 3 : 1 + Math.sin(now * 3) * .8;
    const r = (4 + lv('fat') * .7) * grow;
    ball(LX + Math.cos(a) * st, LY + 2 + Math.sin(a) * st, r); ball(LX, LY - 1, r * .7);
    orb(LX + Math.cos(a) * st, LY + 2 + Math.sin(a) * st, r + 1.5);
  }
}
function post() {
  for (const p of R.pods) {
    if (p.dead || p.born < .18) continue; const x = p.x + p.ox, y = p.y + p.oy;
    if (p.type === 'bomb') { ctx.fillStyle = (now * 4 | 0) & 1 ? '#fff' : '#ffc944'; ctx.fillRect(x - 2 | 0, y | 0, 5, 1); ctx.fillRect(x | 0, y - 2 | 0, 1, 5); }
    else { const h = hits(p); if (h > 1) num(x + .5, y + .5, Math.min(99, h), '#1c1147'); }
  }
  for (const r of R.rings) ring(r.x, r.y, r.r, r.c);
  for (const b of R.balls) if (!b.mini) eyes(b.x, b.y - .5, 1, clamp(b.vx * .01, -1, 1), clamp(b.vy * .006, -1, 1), false);
  if (R.left > 0 && R.state === 'play') { const a = aim ? aim.a : Math.PI / 2; eyes(LX + Math.cos(a) * 2, LY + 1.5 + Math.sin(a) * 2, 1, 0, 0, now % 3.6 < .13, !!aim); }
  if (aim && R.left > 0 && R.state === 'play') {   // dotted preview of the shot
    const g = { x: LX + Math.cos(aim.a) * 8, y: LY + Math.sin(aim.a) * 8, vx: Math.cos(aim.a) * SPEED, vy: Math.sin(aim.a) * SPEED, r: 4 + lv('fat') * .7 };
    let after = -1; const steps = 90 + lv('aim') * 60, extra = 8 + lv('aim') * 26;
    for (let i = 0; i < steps; i++) {
      if (stepBall(g, 1 / 120, false) && after < 0) after = i;
      if (after >= 0 && i - after > extra) break;
      if (g.y > pool.top(g.x)) break;
      if (i % 5 === (now * 24 | 0) % 5) { ctx.fillStyle = after >= 0 ? '#74bcff' : '#ffffff'; ctx.fillRect(g.x | 0, g.y | 0, i < 30 && after < 0 ? 2 : 1, i < 30 && after < 0 ? 2 : 1); }
    }
  }
}

// ══════════════════════════ UI ══════════════════════════
let shownGoo = 0, freshIds = [];
const ui = {
  round() { $('depth').textContent = 'depth ' + S.layer; this.pips(); this.bar(); this.combo(); if (S.rounds === 0 && !BOT) { $('hint').textContent = 'drag to aim\nlet go to drop'; $('hint').classList.add('on'); } },
  pips() { if (BOT) return; const n = maxDrops(); $('pips').innerHTML = Array.from({ length: n }, (_, i) => `<i class="dot${i >= R.left ? ' used' : ''}"></i>`).join(''); },
  bar() { if (BOT) return; $('bar').firstChild.style.width = (R.total ? R.popped / R.total * 100 : 0) + '%'; },
  combo() {
    if (BOT) return; const c = $('combo');
    if (R.combo >= 3) { c.innerHTML = R.combo + '<small>combo</small>'; c.classList.add('on'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
    else c.classList.remove('on');
  },
  shop() {
    if (BOT) return;
    $('res').firstChild.textContent = '+' + fmt(R.got);
    $('res').lastChild.textContent = R.cleared ? `cleared! going down to depth ${S.layer}` : `popped ${R.pct}% · best ${S.best}%\npop every pod in one round to go deeper`;
    $('res').lastChild.style.whiteSpace = 'pre-line';
    this.cards(); $('combo').classList.remove('on'); $('sheet').classList.add('open');
  },
  cards(boughtId) {
    const box = $('cards'), y = box.scrollTop;
    box.innerHTML = '';
    for (const u of UP) {
      const l = lv(u.id), isOpen = open(u), c = cost(u), maxed = l >= u.max, can = isOpen && !maxed && S.goo >= c;
      const el = document.createElement('div');
      el.className = 'card' + (!isOpen ? ' locked' : maxed ? ' maxed' : can ? ' can' : ' poor');
      if (isOpen && !S.seen[u.id]) { S.seen[u.id] = 1; if (u.depth) { el.classList.add('fresh'); el.dataset.fresh = 1; } }
      if (u.id === boughtId) el.classList.add('bought');
      const pips = u.max <= 7 ? `<span class="pipr">${Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'f' : ''}"></i>`).join('')}</span>` : `<span style="color:var(--dim);font-weight:400">lv ${l}</span>`;
      if (!isOpen) el.innerHTML = `<div class="t"><div class="n">? ? ?</div><div class="d">found at depth ${u.depth}</div></div>`;
      else {
        el.innerHTML = `<div class="t"><div class="n">${u.name} ${pips}${el.dataset.fresh ? '<span class="tag">new</span>' : ''}</div><div class="d">${u.desc}</div></div><button>${maxed ? 'max' : fmt(c)}</button>`;
        el.lastChild.onclick = () => buy(u);
      }
      box.appendChild(el);
    }
    box.scrollTop = y;
  },
};
function buy(u) {
  const c = cost(u); if (!open(u) || lv(u.id) >= u.max || S.goo < c) { bloop(110, .1, .06); return false; }
  S.goo -= c; S.up[u.id] = lv(u.id) + 1; save();
  arpeggio(4 + Math.min(6, lv(u.id)), 3); buzz(12); if (!BOT) { ui.cards(u.id); ui.pips(); }
  return true;
}
$('go').onclick = () => { initAudio(); $('sheet').classList.remove('open'); newRound(); bloop(note(2), .2, .1); };
$('reset').onclick = () => { if (confirm('Start over from nothing?')) { try { localStorage.removeItem(SAVE); } catch (_) {} location.reload(); } };
$('mute').onclick = () => { initAudio(); muted = !muted; if (master) master.gain.value = muted ? 0 : .9; $('mute').style.opacity = muted ? .4 : 1; save(); };
$('mute').style.opacity = muted ? .4 : 1;

// aiming: touch anywhere, the shot points from the tap toward your finger
function aimAt(e) {
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * GW, y = Math.max(LY + 6, (e.clientY - r.top) / r.height * GH);
  aim = { a: clamp(Math.atan2(y - LY, x - LX), .09 * Math.PI, .91 * Math.PI) };
}
cv.addEventListener('pointerdown', e => { initAudio(); if (R.state !== 'play') return; try { cv.setPointerCapture(e.pointerId); } catch (_) {} aimAt(e); });
cv.addEventListener('pointermove', e => { if (aim) aimAt(e); });
cv.addEventListener('pointerup', e => { if (!aim) return; aimAt(e); fire(aim.a); aim = null; });
cv.addEventListener('pointercancel', () => { aim = null; });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// ══════════════════════════ loop ══════════════════════════
let last = performance.now();
function frame(t) {
  const dt = Math.min(1 / 30, (t - last) / 1000); last = t;
  if (AUTO) autoFire();
  update(dt);
  f.globalCompositeOperation = 'source-over'; f.fillStyle = '#000'; f.fillRect(0, 0, GW, GH);
  f.globalCompositeOperation = 'lighter'; orbs.length = 0;
  draw(); render(dt); post();
  shakeAmt *= Math.pow(.0005, dt);
  cv.style.transform = shakeAmt > .3 ? `translate(${rnd(-1, 1) * shakeAmt}px,${rnd(-1, 1) * shakeAmt}px)` : '';
  const target = S.goo; shownGoo += (target - shownGoo) * Math.min(1, dt * 14); if (Math.abs(target - shownGoo) < .6) shownGoo = target;
  $('goo').textContent = fmt(Math.round(shownGoo));
  requestAnimationFrame(frame);
}

function autoFire() { if (R.state === 'play' && R.left > 0 && R.cool <= 0 && R.t > .8) { fire(rnd(.3, .7) * Math.PI); aim = R.left > 0 ? { a: 1.1 } : null; } }
// headless balance bot: plays N rounds with rough aim and buys the cheapest thing
function runBot(n) {
  const log = []; let secs = 0;
  for (let k = 0; k < n; k++) {
    newRound(); R.h0 = (R.pods.reduce((a, p) => a + hits(p), 0) / R.total).toFixed(1); let steps = 0;
    while (R.state !== 'shop' && steps++ < 60 * 120) {
      if (R.state === 'play' && R.left > 0 && R.cool <= 0 && R.t > .7) { const live = R.pods.filter(p => !p.dead), p = live[Math.random() * live.length | 0]; fire(clamp((p ? Math.atan2(p.y - LY, p.x - LX) : 1.57) + rnd(-.12, .12), .3, 2.84)); }
      update(1 / 60);
    }
    secs += steps / 60 + 5;
    const got = R.got, pct = R.pct, cleared = R.cleared, bought = [];
    for (;;) { const c = UP.filter(u => open(u) && lv(u.id) < u.max && cost(u) <= S.goo).sort((a, b) => cost(a) - cost(b))[0]; if (!c) break; buy(c); bought.push(c.id); }
    log.push(`r${k + 1} h=${R.h0} t=${(secs / 60).toFixed(1)}m L${S.layer}${cleared ? '*' : ''} pods=${R.total} pop=${pct}% combo=${R.best} got=${got} goo=${S.goo} buy=${bought.join(',')}`);
  }
  $('botlog').textContent = log.join('\n');
}

fit(); addEventListener('resize', () => { if (fit() && R) { pool = makePool(); if (R.state === 'play' && !R.shots) newRound(); } });
if (BOT) runBot(BOT); else {
  newRound(); shownGoo = S.goo;
  if (AUTO) for (let i = 0; i < 60 * (+params.get('auto') || 3) && R.state !== 'shop'; i++) { autoFire(); update(1 / 60); }   // pre-roll for screenshots
  requestAnimationFrame(frame);
}
</script>
</body>
