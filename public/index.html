<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07081a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A small drop. A long way down. A gloopy one-thumb game.">
<title>bloop.in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%233f8cff'/><circle cx='5.5' cy='5.5' r='2' fill='%23b8e6ff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"><div id="stage" class="cine">
  <canvas id="c"></canvas>
  <div id="fx"></div>

  <!-- in-round HUD -->
  <div id="bar" class="ui"><i></i></div>
  <div id="hud" class="ui">
    <div id="goo" class="pill">0</div>
    <div id="right"><span id="depth" class="pill"></span><button id="menuBtn" class="pill" aria-label="menu"><i></i><i></i><i></i></button></div>
  </div>
  <div id="pips" class="ui"></div>
  <div id="left" class="ui"></div>
  <div id="zone" class="ui"></div>
  <div id="combo" class="ui"></div>
  <div id="haul" class="ui"></div>
  <div id="hint" class="ui"></div>
  <div id="ff" class="ui">hold to speed up</div>
  <div id="toast" class="ui"></div>
  <button id="shopBtn" class="pill">upgrades</button>

  <!-- upgrade sheet -->
  <div id="sheet">
    <div id="grab"></div>
    <div id="res"><div><small id="resL">this dive</small><b id="resN"></b></div><span id="resS"></span></div>
    <div id="cards"></div>
    <div id="foot"><button id="go">DROP</button></div>
  </div>

  <!-- menu: notes, the deep, settings -->
  <div id="menu">
    <div class="mh"><span class="logo sm" id="logoSm"></span><button id="menuX" aria-label="close">×</button></div>
    <div class="tabs"><button data-tab="Notes">notes</button><button data-tab="Deep">the deep</button><button data-tab="Set">settings</button><i id="tabInk"></i></div>
    <div class="pane" id="tabNotes"></div>
    <div class="pane" id="tabDeep"></div>
    <div class="pane" id="tabSet">
      <div class="row"><span>music</span><button class="sw" data-opt="music" aria-label="music"></button></div>
      <div class="row"><span>sounds</span><button class="sw" data-opt="sfx" aria-label="sounds"></button></div>
      <div class="row"><span>vibration<small id="buzzNote"></small></span><button class="sw" data-opt="buzz" aria-label="vibration"></button></div>
      <div class="row"><span>your name<small>other drops see this in the deep</small></span><input id="nameIn" maxlength="14" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <h4>save</h4>
      <p class="hintp">your dive saves itself on this device. a save code lets you carry it to another one.</p>
      <textarea id="saveBox" rows="2" placeholder="paste a save code here" spellcheck="false"></textarea>
      <div class="btns"><button id="expBtn" class="btn">copy my save</button><button id="impBtn" class="btn">load this code</button></div>
      <div class="btns"><button id="introBtn" class="btn ghost">replay intro</button><button id="wipeBtn" class="btn ghost danger">erase all</button></div>
      <h4>cheat codes</h4>
      <div class="btns"><input id="cheatIn" placeholder="type a code" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="cheatBtn" class="btn">enter</button></div>
      <p class="hintp" id="cheatMsg"></p>
      <div id="credits">
        <span class="logo sm" id="logoCr"></span>
        <p>made by <b>SHAAN</b> with <button id="heart" aria-label="love">♥</button></p>
        <small id="hearts"></small>
      </div>
    </div>
  </div>

  <!-- a note from a bottle -->
  <div id="note"><div class="paper"><small id="noteN"></small><p id="noteT"></p><i class="sig">n</i><button id="noteOk" class="btn">keep</button></div></div>

  <!-- intro captions -->
  <div id="story"><p id="cap"></p><button id="skip" class="pill">skip</button></div>

  <!-- title -->
  <div id="title">
    <p class="sub">a small drop. a long way down.</p>
    <p class="where" id="where"></p>
    <button id="diveBtn">tap to dive</button>
    <p class="who">made by shaan</p>
  </div>
</div></div>
<pre id="botlog"></pre>

<script src="js/render.js"></script>
<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/story.js"></script>
<script src="js/game.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
